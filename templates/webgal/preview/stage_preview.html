      let cnt = 0, maxd = 0, sx = 1e9, sy = 1e9, ex = -1, ey = -1;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const p = (y * W + x) * 4;
          const d = Math.max(Math.abs(dA[p] - dB[p]), Math.abs(dA[p + 1] - dB[p + 1]),
                             Math.abs(dA[p + 2] - dB[p + 2]), Math.abs(dA[p + 3] - dB[p + 3]));
          if (d > 8) {
            cnt++; if (d > maxd) maxd = d;
            if (x < sx) sx = x; if (y < sy) sy = y;
            if (x > ex) ex = x; if (y > ey) ey = y;
          }
        }
      }
      resolve({
        box: box, frames: N, dt: D,
        openV: openV, shutV: shutV,
        openStat: A.stat, shutStat: B.stat,
        diffPixels: cnt, totalPixels: W * H,
        diffRatio: +(cnt / (W * H)).toFixed(5),
        maxDiff: maxd,
        diffBox: cnt ? [sx + box[0], sy + box[1], ex - sx + 1, ey - sy + 1] : null,
        sameImage: cnt === 0,
      });
    };
    let pending = 2;
    const tick = () => { if (--pending === 0) finish(); };
    const imgA = new Image(), imgB = new Image();
    imgA.onload = () => { cxA.drawImage(imgA, 0, 0); tick(); };
    imgB.onload = () => { cxB.drawImage(imgB, 0, 0); tick(); };
    imgA.onerror = () => { resolve({ err: "imgA_load_failed" }); };
    imgB.onerror = () => { resolve({ err: "imgB_load_failed" }); };
    imgA.src = A.url; imgB.src = B.url;
  }).then(_finishAll).catch((e) => _finishAll({ err: String(e) }));
  return "started";
};

// 读回嘴部参数的当前值（Cubism2/3 都试）
window.__muppetReadMouth = function (modelId) {
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) return { err: "no_model" };
  const cm = s.model.internalModel && s.model.internalModel.coreModel;
  if (!cm) return { err: "no_core_model" };
  const out = {};
  for (const nm of ["PARAM_MOUTH_OPEN_Y", "ParamMouthOpenY"]) {
    try {
      if (typeof cm.getParamFloat === "function") out[nm] = cm.getParamFloat(nm);
    } catch (e) {}
  }
  out.lastWrite = lipLastWrite;
  return out;
};

// v3.6.4：完整生命周期探针 —— 写参数 -> update -> render，每步读回。
// 用来回答「参数到底会不会被 update/render 覆盖」这个关键问题。
// 必须放在页面内：slots / _writeMouth 都是模块私有，外部 JS 拿不到
// （实测直接写 slots 一律 "slots is not defined"）。
window.__muppetLipLifecycle = function (v, modelId) {
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) return { err: "no_model" };
  const m = s.model;
  const cm = m.internalModel && m.internalModel.coreModel;
  if (!cm) return { err: "no_core_model" };
  const rd = () => {
    try {
      if (typeof cm.getParamFloat === "function") {
        return cm.getParamFloat("PARAM_MOUTH_OPEN_Y");
      }
    } catch (e) {}
    return null;
  };
  const log = [];
  log.push(["init", rd()]);
  const w = _writeMouth(m, v);
  log.push(["after_write", rd()]);
  try { m.update(1000 / 30); } catch (e) { log.push(["update_err", String(e)]); }
  log.push(["after_update", rd()]);
  try { if (app) app.render(); } catch (e) {}
  log.push(["after_render", rd()]);
  return { steps: log, write: w, clockManual: clock.manual };
};

// v3.6.8：动作状态探针 —— 当前在播哪个动作、优先级多少。
// 用来回答「动作播放期间切动作，新动作到底起没起来」。
window.__muppetMotionState = function (modelId) {
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) return { err: "no_model" };
  const mm = s.model.internalModel && s.model.internalModel.motionManager;
  if (!mm) return { err: "no_motionManager" };
  const st = mm.state || {};
  return {
    currentGroup: st.currentGroup === undefined ? null : st.currentGroup,
    currentIndex: st.currentIndex === undefined ? null : st.currentIndex,
    currentPriority: st.currentPriority === undefined ? null : st.currentPriority,
    reservedGroup: st.reservedGroup === undefined ? null : st.reservedGroup,
    playing: !!mm.playing,
    lastCmd: last.motion[modelId] || null,
  };
};

// v3.6.8：确认走哪套 Core（决定动作切换是交叉淡出还是被优先级拒绝）。
window.__muppetCoreInfo = function (modelId) {
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) return { err: "no_model" };
  const im = s.model.internalModel || {};
  const cm = im.coreModel || {};
  const mm = im.motionManager || {};
  const qm = mm.queueManager || {};
  return {
    // Cubism2 的 coreModel 是压缩名（getParamIndex/setParamFloat 那套）
    hasGetParamIndex: typeof cm.getParamIndex === "function",
    hasSetParamFloat: typeof cm.setParamFloat === "function",
    hasSetParamById: typeof cm.setParameterValueById === "function",
    // Cubism2 的 queueManager 有 motions 数组（新旧动作同时排队 = 交叉淡化）
    queueHasMotionsArray: !!qm.motions,
    queueMotionsLen: qm.motions ? qm.motions.length : null,
    motionManagerHasState: !!mm.state,
  };
};

// v3.6.8：动作队列快照 —— 切动作时能看到新旧动作是否**同时**在播。
// Cubism2 的 queue 是 motions 数组：push 新动作时给旧的设淡出，
// 两者共存一段时间 => 画面是平滑过渡，不是硬跳。
window.__muppetQueue = function (modelId) {
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) return { err: "no_model" };
  const mm = s.model.internalModel && s.model.internalModel.motionManager;
  if (!mm) return { err: "no_motionManager" };
  const qm = mm.queueManager || {};
  const out = { size: qm.motions ? qm.motions.length : null, items: [] };
  if (qm.motions) {
    for (const m of qm.motions) {
      if (!m) continue;
      const mo = m._$w0 || m.motion || null;
      out.items.push({
        // fadeOut 由 startMotion 在切换时设给旧动作
        finished: typeof m.isFinished === "function" ? m.isFinished() : null,
        lastTime: m._$AT === undefined ? null : m._$AT,
        fadeOut: mo && typeof mo.getFadeOut === "function"
                 ? mo.getFadeOut() : null,
      });
    }
  }
  const st = mm.state || {};
  out.currentGroup = st.currentGroup === undefined ? null : st.currentGroup;
  out.currentPriority = st.currentPriority === undefined ? null : st.currentPriority;
  return out;
};

// v3.6.8：姿态探针 —— 读一组**由动作曲线驱动**的躯干参数。
// 用来验证「切动作后姿态真的变了」，而不是只看 state 里写了什么名字。
// （像素比对在离屏 WebEngine 抓不到 WebGL 内容，alpha 全 0，历史已知坑。）
window.__muppetPose = function (modelId) {
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) return { err: "no_model" };
  const cm = s.model.internalModel && s.model.internalModel.coreModel;
  if (!cm) return { err: "no_core_model" };
  const names = ["PARAM_ANGLE_X", "PARAM_ANGLE_Y", "PARAM_ANGLE_Z",
                 "PARAM_BODY_ANGLE_X", "PARAM_BODY_ANGLE_Z",
                 "PARAM_ARM_L", "PARAM_ARM_R",
                 "PARAM_SHOULDER_L", "PARAM_SHOULDER_R",
                 "PARAM_BREATH"];
  const out = { vals: {} };
  for (const nm of names) {
    try {
      if (typeof cm.getParamFloat === "function") {
        const v = cm.getParamFloat(nm);
        if (typeof v === "number") out.vals[nm] = +v.toFixed(5);
      }
    } catch (e) {}
  }
  return out;
};

// v3.6.4：时钟/相位探针（排障专用）。必须定义在页面源码里 ——
// vclock / clock / slots 都是模块私有，外部注入的同名函数在全局作用域
// 访问它们会抛 ReferenceError，而 runJavaScript 会把异常吞成**空字符串**
// （实测：好几轮诊断因此拿到空结果、白跑）。凡是要看内部状态的一律写进
// 本文件，不要从 Python 侧注入。
window.__muppetClock = function (modelId) {
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  return {
    vclockOn: vclock.on,
    vclockT: vclock.t,
    manual: clock.manual,
    k: s ? s.k : null,
    // 口型相位基准（clip 内偏移）。与 k 分开是为了能一眼看出跨 clip 后
    // 是否回到 0 —— 混用 k 会让 lip 索引越界、嘴定死（v3.6.9 修复）。
    lipK: s ? (s.lipK === undefined ? null : s.lipK) : null,
    dt: s ? s.dt : null,
    elapsed: s && s.model ? s.model.elapsedTime : null,
    delta: s && s.model ? s.model.deltaTime : null,
    hasLip: modelId ? lipTable.has(modelId) : false,
    lipNow: modelId ? (lipNow.get(modelId) === undefined
                       ? null : lipNow.get(modelId)) : null,
    lastWrite: lipLastWrite,
    // v3.6.6：钩子证据 —— runs 在涨 = 事件真的在跑；motionV/lipV 不同 =
    // 我们确实在「动作结算之后」改写了它（这是判断修好没修好的硬指标）
    lipHookRuns: lipHookRuns,
    lipHookFails: lipHookFails,
    lipHookStat: lipHookStat,
  };
};

// v3.6.5：诊断探针 —— 当前有哪些立绘 slot、各自有没有模型、是否可见。
// 用来量「切 clip 时人物是不是整人消失一瞬」（最常见的闪烁形态）：
// 采这个比抓像素稳（自动时钟下 canvas 有时抓不出内容，实测 alpha 全 0）。
// v3.6.5b：**把 _zombies 也算进来** —— 「延迟销毁」的旧模型仍挂在
// 场景里显示（用户看得见），但不在 slots 里；不算它会把"人物还在"误判成
// "整人消失"。真空白 = slots 无模型 且 _zombies 无模型。
window.__muppetFigures = function () {
  const out = [];
  slots.forEach((s, id) => {
    out.push({
      id: id,
      hasModel: !!s.model,
      visible: !!(s.model && s.model.visible),
      alpha: s.model ? s.model.alpha : null,
      ref: s.ref ? String(s.ref).split("/").slice(-2).join("/") : "",
      k: s.k,
    });
  });
  _zombies.forEach((m, i) => {
    out.push({
      id: "<zombie" + i + ">",
      zombie: true,
      hasModel: true,
      visible: !!(m && m.visible),
      alpha: m ? m.alpha : null,
      ref: "",
      k: -1,
    });
  });
  out._meta = {
    stageChildren: app ? app.stage.children.length : -1,
    zombies: _zombies.length,
    loading: _loading,
  };
  return out;
};

window.__muppetState = function () {
  const models = [];
  slots.forEach((s, id) => { if (s.model) models.push(id); });
  const one = slots.get(models[0]);
  const m = one && one.model;
  return {
    booted, pixi: !!window.PIXI, sdk2: !!window.Live2DModelWebGL,
    stageChildren: app ? app.stage.children.length : -1,
    models, lastMotion: last.motion, lastExpression: last.expression,
    transform: last.transform,
    rendererType: app ? app.renderer.type : -1,
    contextLost: app && app.renderer.view ? !!app.renderer.contextLost : null,
    modelInfo: m ? { x: m.x, y: m.y, sx: m.scale.x, sy: m.scale.y,
                     visible: m.visible,
                     alpha: m.alpha, w: m.width, h: m.height } : null,
    // v3.5.2：三层状态（截图/断言用；也方便排查"为什么没背景"）
    bg: { url: state.bgUrl, hasSprite: !!bgSprite,
          w: bgSprite ? Math.round(bgSprite.width) : 0,
          h: bgSprite ? Math.round(bgSprite.height) : 0 },
    subtitle: (function () {
      const b = document.getElementById("subtitle");
      return { visible: !!b && b.style.display !== "none",
               who: document.getElementById("sub-name")
                    ? document.getElementById("sub-name").textContent : "",
               text: document.getElementById("sub-text")
                    ? document.getElementById("sub-text").textContent : "" };
    })(),
    filter: state.filter,
    // v3.6.3：立绘滤镜（bevel/bloom）实际挂载状态 —— 断言「到底生不生效」
    // 必须能看到 figLayer.filters 里有几个、uniform 是什么，否则
    // 「无编译错误」也可能只是滤镜压根没创建（踩过这个假通过）。
    figFilters: (function () {
      if (!figLayer) return { count: -1, names: [] };
      const fs = figLayer.filters || [];
      const arr = Array.isArray(fs) ? fs : [fs];
      return {
        count: arr.length,
        names: arr.map(function (f, i) {
          if (!f || !f.uniforms) return "?";
          const u = f.uniforms;
          if (u.transformX !== undefined) return "bevel";
          if (u.bloomTexture !== undefined) return "bloom";
          if (u.threshold !== undefined) return "bloomExtract";
          if (u.blur !== undefined || f.blur !== undefined) return "blur";
          return "filter" + i;
        }),
        hasBevelUniforms: arr.some(f => f && f.uniforms
          && f.uniforms.transformX !== undefined),
        hasBloomUniforms: arr.some(f => f && f.uniforms
          && f.uniforms.bloomTexture !== undefined),
      };
    })(),
    // 手动时钟状态（导出动画泵/测试用）：heads 给每个 slot 当前步号
    clock: (function () {
      const heads = {};
      slots.forEach((s, id) => { if (s.model) heads[id] = { k: s.k, dt: s.dt, autoUpdate: s.model.autoUpdate, vis: !!s.model.visible }; });
      return { manual: clock.manual, dt: clock.dt, paused: !!(app && app.ticker.paused), heads };
    })(),
  };
};
</script>
</body>
