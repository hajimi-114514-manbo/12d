<!DOCTYPE html>
<!-- H3a 产品化宿主页（MuppetStudio 自写胶水；WebGAL 官方 DOM 骨架按 MIT 出处引用）。
     本文件**不含任何第三方 js**：__MUPPET_*__ token 由 webgal_preview.py 在
     运行时经 muppet:// scheme 注入（runtime 哈希文件名、lib SDK 路径全部
     运行时解析；lib 缺失注入 null，页面报 error 降级）。
     页面职责：boot 引擎模块图（index.es -> 主包，#root/live2dPromise 三前提）
     -> 自建 PIXI.Application -> puppetAPI 五命令（loadModel/setTransform/
     playMotion/setExpression/clearModel）按 modelId 槽位串行化 -> 事件经
     __muppetSend 回桥。协议：docs/H3桥接协议设计.md。 -->
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<title>Muppet Stage Preview</title>
<style>
  html, body { margin: 0; background: #0d0f13; width: 100%; height: 100%;
               overflow: hidden; }
  /* ---- v3.5.2：舞台区改成「自己就是 16:9 画面框」----
     原来 #stagebox 是 inset:0 铺满窗口、内部 flex 居中 canvas，画面有黑边。
     现在让 #stagebox 直接算成 16:9 的最大内接矩形（min(100vw, 100vh*16/9)），
     body 负责居中。好处：字幕/tint 用 inset:0 铺 #stagebox 就**精确覆盖
     画面**，跟黑边无关 —— 不需要 JS 同步 getBoundingClientRect
     （实测那个在 WebEngine 里基准不可靠，字幕会飞到左上角）。 */
  body { display: flex; align-items: center; justify-content: center; }
  #stagebox { position: relative; flex: 0 0 auto;
              width: min(100vw, calc(100vh * 16 / 9));
              height: min(100vh, calc(100vw * 9 / 16));
              display: flex; align-items: center; justify-content: center;
              overflow: hidden; }
  /* canvas 保持 PIXI 自己算的 CSS 尺寸（它会把 1280x720 缩放到容器内）。
     **不要**给它设 width:100%/height:100% 或 absolute —— 实测这两种做法都会
     让 PIXI 的渲染失效：width:100% 时画面只显示右半（canvas.x 变 -500），
     absolute+inset:0 时画面整个消失（只剩 DOM 字幕）。
     交给 PIXI：它自己按容器尺寸 set 到位图与 CSS 尺寸。 */
  #stagebox canvas { display: block; max-width: 100%; max-height: 100%;
                     z-index: 1; }

  #errline { position: absolute; left: 10px; bottom: 8px; z-index: 30;
             color: #ff9b9b; font: 12px/1.5 "Microsoft YaHei", sans-serif;
             text-shadow: 0 1px 2px #000; pointer-events: none; }
  /* ---- v3.5.2：滤镜叠加色层（模拟 setTransform 的 colorR/G/B 偏色）----
     inset:0 铺满 #stagebox（#stagebox 现在就是 16:9 画面框） */
  #tint { position: absolute; inset: 0; z-index: 5; display: none;
          pointer-events: none; mix-blend-mode: multiply; }
  /* ---- v3.5.2：字幕层（对齐导出皮肤：白字黑描边 + 蓝名字胶囊）----
     纯 CSS 居中底部定位，**不用 JS 同步坐标**：getBoundingClientRect 在
     这个 WebEngine 环境里返回的基准不可靠（实测字幕飞到左上角）。
     字幕层铺满 #stagebox，内部 flex 底部居中 -> 与 canvas 视觉同区。 */
  #subtitle { position: absolute; inset: 0; z-index: 20; display: none;
              flex-direction: column; align-items: center;
              justify-content: flex-end; padding: 0 6% 6%;
              box-sizing: border-box; pointer-events: none;
              text-align: center;
              font-family: "Microsoft YaHei", sans-serif; }
  #sub-name { display: inline-block; margin-bottom: 6px; padding: 2px 12px;
              border-radius: 999px; background: #4c88ff; color: #fff;
              font-size: 15px; font-weight: 600;
              box-shadow: 0 2px 6px rgba(0,0,0,.45); }
  #sub-text { color: #fff; font-size: 22px; font-weight: 700;
              line-height: 1.35; white-space: pre-wrap;
              /* 8 方向描边：用多重 text-shadow 近似（与 QPainter 版视觉一致）*/
              text-shadow: -2px -2px 0 #000, 2px -2px 0 #000,
                           -2px 2px 0 #000, 2px 2px 0 #000,
                           0 -2px 0 #000, 0 2px 0 #000,
                           -2px 0 0 #000, 2px 0 0 #000,
                           0 3px 8px rgba(0,0,0,.6); }
</style>
<script>
  // 官方 index.html「加载IIFE插件」等价物：lib 路径由 Python 注入（可为 null）。
  window.__WEBGAL_DEVICE_INFO__ = { isIOS: false, isIOSPhone: false, isIPad: false };
  function muppetLoadLib(u) {
    if (!u) return Promise.resolve(false);
    return new Promise(function (res) {
      const s = document.createElement("script");
      s.src = u; s.onload = function () { res(true); };
      s.onerror = function () { res(false); };
      document.head.appendChild(s);
    });
  }
  // 主包构造期 Rte.initLive2D await 它——三前提之一（J2 README 关键事实 3）。
  window.live2dPromise = Promise.all([
    muppetLoadLib(__MUPPET_LIB2__),
    muppetLoadLib(__MUPPET_LIB4__),
  ]);
  // v3.5.11：引擎主包 gameConfigInit 末尾会调 window.renderPromiseResolve()
  // 作为「渲染就绪」握手（主包最外层 await 它）。官方 index.html 由引擎自己
  // 提供该函数；我们的宿主页必须自备，否则主包在
  // `window.renderPromiseResolve()` 处抛 TypeError -> 主包求值中断 ->
  // window.PIXI 永不建立 -> L2D 无法渲染（实测根因）。
  // 约定：主包调它表示「配置就绪、可以渲染了」，我们记录后 resolve。
  window.__muppetRenderReady = new Promise(function (res) {
    window.renderPromiseResolve = function () {
      try { res(true); } catch (e) { /* 已 resolve 忽略 */ }
    };
  });
</script>
</head>
<body>
<div id="stagebox">
  <!-- v3.6.2：背景独立层（DOM img），可与立绘层分别套不同 CSS filter。
       层级：bglayer(0) < canvas(1) < tint(5) < subtitle(20) -->
  <div id="bglayer" style="position:absolute;inset:0;z-index:0;display:none;
       overflow:hidden;pointer-events:none;">
    <img id="bgimg" alt="" style="position:absolute;left:50%;top:50%;
         min-width:100%;min-height:100%;width:auto;height:auto;
         transform:translate(-50%,-50%);object-fit:cover;" />
  </div>
  <div id="tint"></div>
  <div id="subtitle">
    <span id="sub-name"></span>
    <div id="sub-text"></div>
  </div>
</div>
<div id="errline"></div>
<!-- 引擎主包求值期强依赖的 DOM 骨架（J2 关键事实 3；官方 index.html 同构） -->
<div id="ebg" class="html-body__effect-background">
  <div id="ebgOverlay" class="html-body__effect-background-overlay"></div>
</div>
<div class="html-body__title-enter" style="display:none"></div>
<div id="html-body__panic-overlay"></div>
<div id="root" style="position:absolute;left:-99999px;top:0;width:1px;height:1px;overflow:hidden"></div>

<script type="module">
const STAGE_W = 1280, STAGE_H = 720;
const ES_URL = __MUPPET_ES__;
const sendEvt = (evt, data, ref) =>
  window.__muppetSend(JSON.stringify({ v: 1, ref: ref || 0, evt, data: data || {} }));
const showErr = (m) => { document.getElementById("errline").textContent = m; };

let es = null, app = null, booted = false;
// v3.6.2：立绘统一挂在这个 Container 下（不再直接挂 stage）——
// 这样才能给「全部立绘」挂 PIXI 滤镜（bevel 浮雕 / bloom 泛光），
// 而背景已经拆成独立 DOM 层，不会连带被处理。
let figLayer = null;
// 当前挂着的立绘滤镜（bevel / bloom），供幂等更新
let figFilters = { bevel: null, bloom: null, bloomPass: null };
const slots = new Map();          // modelId -> {queue, model, ref, fit}
const last = { motion: {}, expression: {}, transform: {} };
// v3.6.4：口型匹配。每个 modelId 一份「开口度采样表」，
// 由 Python 侧（lip_sync.py）算好下发，页面只负责按下标取 + 写参数。
//   lipTable: modelId -> { fps, vals: number[], start: 秒, gain: 倍数 }
// 为什么下发表格而不是让页面自己算：
//   运行时的口型靠 AnalyserNode 实时抓 <audio>，导出时是离线逐帧合成、
//   根本没有播放，拿不到频谱；而且它的阈值是「本次播到的峰值」相对量，
//   跑两次可能不一样。导出要求确定性，所以包络在 Python 侧离线算完。
const lipTable = new Map();
// 当前写进去的开口度（只为幂等/观测，不影响画面）
const lipNow = new Map();
// 排障：最后一次「写嘴」的结果（写到哪个参数、走的哪套 API、成没成）
let lipLastWrite = null;
// v3.5.2：背景 / 字幕 / 滤镜三层状态（供幂等判断与 __muppetState 观测）
let bgSprite = null;
const state = { bgUrl: "", sub: "", filter: "", userPaused: false };

// 口型参数写入。**两套 API 差别是实打实的坑**（探针实测）：
//   · Cubism 2（coreModel 类是压缩名 "aa"）：只有 `setParamFloat(name, v)`，
//     **没有** `setParameterValueById`；参数名是全大写 `PARAM_MOUTH_OPEN_Y`。
//   · Cubism 3+：有 `setParameterValueById`，参数名 `ParamMouthOpenY`。
// 原来只写 `setParameterValueById("ParamMouthOpenY")`，在 Cubism2 模型上
// 方法不存在 -> 抛异常 -> 被 try 吞掉 -> 静默无效（实测 maxdiff=0）。
// 现在两套都试，并且用 getParamIndex 先确认参数真的存在，写不写得上
// 有据可查（`__muppetProbeModel().mouthWritten`）。
function _writeMouth(model, open) {
  const im = model && model.internalModel;
  const cm = im && im.coreModel;
  if (!cm) return { ok: false, why: "no_coreModel" };
  const v = Math.max(0, Math.min(1, Number(open) || 0));
  const tried = [];

  // ---- Cubism 2：getParamIndex + setParamFloat ----
  try {
    if (typeof cm.getParamIndex === "function" &&
        typeof cm.setParamFloat === "function") {
      for (const nm of ["PARAM_MOUTH_OPEN_Y", "ParamMouthOpenY"]) {
        let idx = -1;
        try { idx = cm.getParamIndex(nm); } catch (e) {}
        // SDK 用 -1 或 undefined 表示"没这个参数"，别把 -1 当索引
        if (typeof idx === "number" && idx >= 0) {
          cm.setParamFloat(nm, v);
          tried.push(nm + "@" + idx);
          return { ok: true, via: "setParamFloat", name: nm, idx, tried };
        }
        tried.push(nm + ":无");
      }
    }
  } catch (e) { tried.push("c2err:" + ((e && e.message) || e)); }

  // ---- Cubism 3+：setParameterValueById ----
  try {
    if (typeof cm.setParameterValueById === "function") {
      for (const nm of ["ParamMouthOpenY", "PARAM_MOUTH_OPEN_Y"]) {
        cm.setParameterValueById(nm, v);
        tried.push(nm + "@byId");
        return { ok: true, via: "setParameterValueById", name: nm, tried };
      }
    }
  } catch (e) { tried.push("c3err:" + ((e && e.message) || e)); }

  return { ok: false, why: "no_api", tried };
}

// 按「**工程时间** t」取该模型的开口度。
// 表按「片段内相对时间」烘好，所以这里要减掉 clip 起点 tb.start
// （tb.start 由 Python 侧随 setLip 下发）。
//
// v3.6.5 修「做动作时嘴闭上、不对口型」：原来 _lipTick 传的是
// `performance.now() - lipTickerStart`（墙上时钟流逝量），而表是按片段
// 内相对时间烘的 —— 两个基准完全不同，嘴会越播越偏，看起来就是"不对口型"。
// 现在统一用工程播放头时间（apply_state 每帧带进来的 t）。
// 最近一次 _lipAt 返回 null 的原因："stale"（相位与本表不匹配）/ "no_val"。
// 导出侧 _lip_rb_check 会读 lipHookStat.skipped 判「页面是不是在用旧表」。
let lipAtMiss = null;

function _lipAt(modelId, t) {
  const tb = lipTable.get(modelId);
  if (!tb || !tb.vals || !tb.vals.length) { lipAtMiss = "no_val"; return null; }
  const fps = Number(tb.fps) || 30;
  const rel = (Number(t) || 0) - (Number(tb.start) || 0);
  if (rel < 0) { lipAtMiss = null; return 0; }
  let i = Math.round(rel * fps);
  if (i < 0) i = 0;
  if (i >= tb.vals.length) {
    // v3.7.3：表已播完 —— **不再夹到末值**。夹末值正是「嘴定死」的直接成因：
    // 一旦相位基准错位（跨 clip 累积的 s.k、或换了台词没重发 setLip），
    // 索引就永远越界，嘴被钉死在最后一个开口度上，看起来就是 465.7s 之后
    // 彻底闭合、之后一直不动。
    // 末帧 Math.round 溢出一格（i 恰为 len）属正常收尾 -> 闭嘴 0；
    // 再往后就是**相位与本表不匹配**（stale）-> 返回 null，本次不写嘴，
    // 并把原因暴露到 lipHookStat.skipped，供导出侧回读校验告警。
    if (i <= tb.vals.length) { lipAtMiss = null; return 0; }
    lipAtMiss = "stale";
    return null;
  }
  lipAtMiss = null;
  const g = Number(tb.gain) || 1;
  return Math.max(0, Math.min(1, (Number(tb.vals[i]) || 0) * g));
}

// 把口型应用到某个模型。**必须在 update() 之后调用**：
// Live2D 的 update 会用动作曲线/物理重算全部参数，先写会被覆盖掉。
function _applyLip(modelId, t) {
  const s = slots.get(modelId);
  if (!s || !s.model) return;
  const v = _lipAt(modelId, t);
  if (v === null) return;                 // 没绑口型：完全不动嘴
  const r = _writeMouth(s.model, v);
  lipLastWrite = r;                       // 排障：最后一次写到哪个参数上
  if (r && r.ok) lipNow.set(modelId, v);
}

// 立绘包围盒：从**模型几何**算，不从像素量。
// 为什么：早期版本用「首帧 alpha 非零包围盒」定 ROI，结果导出不可复现——
// 首帧抓取会因纹理预热失败拿到空图（实测 k=0 alpha 全 0），于是"用哪一帧
// 定框"随时序漂移，A/B 两个 slot 量出的框差 1px（640x350 vs 640x349），
// 整段后续帧的裁剪全都对不上。模型尺寸/fit/scale 是加载完就确定的量，
// 与墙钟无关，用它才能让逐帧动画保持逐位可复现。
window.__muppetBox = function (modelId, margin) {
  const s = slots.get(modelId);
  if (!s || !s.model) return null;
  const m = s.model;
  const mg = Math.max(0, Number(margin) || 0);
  // **手臂截断修复**：m.width/m.height 是 PIXI DisplayObject 的宽高，
  // 按 moc 原始画布算，**不含动作网格顶点超出的部分**（手臂前伸时顶点
  // 会伸出 moc 范围）。预览时画布 1280×720 够大，手臂在画布内能看见；
  // 导出时按 m.width/m.height 抓框，手臂在框外被截掉。
  // 改用 m.getBounds()：PIXI 的实际渲染包围盒，包含所有顶点（含手臂）。
  // 注意 getBounds() 返回的是全局坐标（含 x/y 偏移），需要转回画布坐标。
  const b = m.getBounds();
  let x = b.x - mg;
  let y = b.y - mg;
  let w = b.width + mg * 2;
  let h = b.height + mg * 2;
  const cx = Math.max(0, Math.floor(x)), cy = Math.max(0, Math.floor(y));
  const cw = Math.min(Math.ceil(w + (x - cx)), STAGE_W - cx);
  const ch = Math.min(Math.ceil(h + (y - cy)), STAGE_H - cy);
  if (cw <= 0 || ch <= 0) return null;
  return [cx, cy, cw, ch];
};

// 重画一帧（不推进时间）：给导出泵做「首帧空图重试」。
// Live2D 模型 loadModel 完成后纹理还在上传，第一次 render 画不出东西
// （实测 k=0 抓到的 alpha 全 0，第二次才有画面）。bundle 里
// `_render` 只在 `deltaTime` 非零时才结算参数，所以 deltaTime=0 的
// 重复 render **不会推进相位**，重试是安全的、也是可复现的。
window.__muppetRedraw = function () {
  if (!app) return false;
  try { app.render(); return true; } catch (e) { return false; }
};

// 抓图（导出动画泵用）：整张 or **固定 ROI 包围盒**。
// 为什么要有 ROI：实测 1080p 立绘整张 1280×720 编码 toDataURL=10.3ms、
// 解码 5.7ms、autocrop 0.7ms = 15.4ms/帧；改成页面侧只 drawImage 出
// 立绘包围盒（275×633）再编码，全链路降到 10.3ms。webp 试过更慢
// （默认 q 编码 20.2ms）且透明区 RGB 会烂（maxdiff 255），弃用。
// 附带好处：一道的裁剪框固定后**不再逐帧抖动**（头发丝出框会让
// 导出侧 fit 基准逐帧微移，实测 1-2px 视觉噪声）。
let _offCv = null, _offCtx = null;
window.__muppetGrab = function (roi) {
  const cv = document.querySelector("canvas");
  if (!cv) return "";
  if (!roi) { try { return cv.toDataURL("image/png"); } catch (e) { return ""; } }
  const x = Math.max(0, Math.round(roi[0] | 0)), y = Math.max(0, Math.round(roi[1] | 0));
  const w = Math.max(1, Math.round(roi[2] | 0)), h = Math.max(1, Math.round(roi[3] | 0));
  if (!_offCv) {
    _offCv = document.createElement("canvas");
    _offCtx = _offCv.getContext("2d", { willReadFrequently: true });
  }
  if (_offCv.width !== w || _offCv.height !== h) { _offCv.width = w; _offCv.height = h; }
  try {
    _offCtx.clearRect(0, 0, w, h);
    _offCtx.drawImage(cv, x, y, w, h, 0, 0, w, h);
    return _offCv.toDataURL("image/png");
  } catch (e) { return ""; }
};

// 注：v3.7.5 曾试过把 PNG 编码搬到 Web Worker 后台（原始 RGBA -> deflate
// -> 回传）。像素确实逐位一致，但**吞吐反而更差**：deflate 压缩约 20ms/帧
// （比 PNG 的 7.9ms 慢），而导出线程必须等这一帧的像素，整片从 116s 变
// 159s。Worker 里 convertToBlob('image/png') 也有损（3 个像素差 1）。
// => 保持同步 toDataURL 这条最快点。

// ===== 手动时钟（导出逐帧动画泵用）=====
// 为什么必须自己驱动：bundle 里 Live2DModel 的时间推进挂在 **Ticker.shared**
//   onTickerUpdate(){ this.update(G.shared.deltaMS) }
//   update(t){ this.deltaTime += t; this.elapsedTime += t }
//   _render(){ if (this.deltaTime) { internalModel.update(deltaTime, elapsedTime); deltaTime = 0 } }
// 两个后果：
// 1) 现有 setPaused 只关 app.ticker，**关不住模型**——导出远快于实时，让
//    模型吃墙上时钟，成片里的呼吸/眨眼就是快进；
// 2) update() 只累加 deltaTime，参数真正结算发生在 render 的 _render 里，
//    所以「一帧一次 update + 一帧一次 render」必须成对，N 次 update 中间
//    不 render 等于一次大跨度 update，不是 N 帧动画。
// 手动模式下：模型 autoUpdate=false（脱离 Ticker.shared），app.ticker 暂停，
// 时间只按调用方给的 dt 走；每个 slot 记住自己已走到第几步（head），
// 第 k 步**永远**是从 0 起走 k 步得到 —— 与请求到达顺序无关，可重现。
const clock = { manual: false, dt: 1000 / 30 };

// v3.6.4：实时预览下的口型驱动。
// 自动模式（clock.manual=false）里模型由 Ticker.shared 驱动，update 和
// render 发生在同一 tick 内 —— 没有地方给我们「update 之后、render 之前」
// 插一脚。所以用一个**低优先级 ticker 回调**在每帧末尾补写参数：
// PIXI 的 ticker 回调按优先级从高到低执行，渲染（Application 自己注册的）
// 在 LOW 之前跑完，此时写参数、再 render 一次即生效。
// 代价是自动模式下每帧多一次 render；只在真的绑了口型时才挂。
let lipTicker = null;
// 当前工程播放头时间（由 setTime 每帧写入）。口型按工程时间取，
// 不能用墙上时钟 —— 见 _lipApplyAll 的注释。
let lipProjT = 0.0;
let lipPlaying = false;
let lipTickerStart = 0;
// v3.6.5：**不再用 ticker 驱动口型**（实测 LOW 优先级回调根本不执行，
// hasLip=true 但 lipNow 恒为 null）。改为 setTime 里正向驱动，
// 这个函数只为兼容旧调用点保留，是空操作。
function _syncLipTicker() { /* no-op：口型由 setTime 驱动 */ }

// v3.6.5：**口型改为「由 Python 每帧驱动」**，不再依赖 PIXI ticker。
//
// 原来挂 ticker LOW 优先级回调去补写嘴部参数，实测**根本没生效**
// （`__muppetClock` 里 hasLip=true 但 lipNow=null，说明 _applyLip 从未跑过）：
//   · ticker 回调可能因优先级常量缺失 / 暂停状态而不执行
//   · 就算跑了，它和模型 `_render` 的先后顺序也不保证
// 现在改成正向驱动：Python 侧每帧发 `setTime{t}`，这里立刻按工程时间
// 算一次开口度并写入。时间源唯一（工程播放头），顺序确定（在 setTime 里）。
function _lipApplyAll() {
  if (clock.manual) return;            // 手动时钟走 seek 里面那条
  if (!lipTable.size) return;
  slots.forEach((s, id) => {
    if (!s.model || !lipTable.has(id)) return;
    _applyLip(id, lipProjT);
  });
}

// ===== v3.6.6：**真正的修法** —— 口型写进 `beforeModelUpdate` 事件里 =====
//
// 用户报「动作刚开始嘴能张，约半秒后就不张了」「动作播完才开口」。根因是
// **写入时机**，不是覆盖对象（嘴参数是独立通道，覆盖它不影响躯干/表情）。
//
// bundle（index.es-*.js）里 ModelInternal.update 的真实顺序：
//     motionManager.update()      <- 动作曲线把嘴写成动作值
//     coreModel.saveParam()/saveParameters()   <- 拍快照
//     expression / eyeBlink / focus / physics / pose
//     emit("beforeModelUpdate")   <-- ★ 唯一的窗口：动作已结算、尚未烘焙
//     coreModel.update()          <- 把参数**烘进绘制数据**
//     coreModel.loadParam()       <- 参数还原成快照值
// 而参数结算发生在 `_render` 里：
//     this.deltaTime && (this.internalModel.update(...), this.deltaTime = 0)
//
// 所以凡是在 update **之前**写嘴（setTime 驱动、ticker 回调都属于此类）——
// 都会被 motionManager 覆盖掉，画出来是动作的嘴。fade-in（默认 500ms）
// 期间动作权重还没到 1，覆盖不彻底，于是「刚开头能张、半秒后闭上」。
//
// 现在挂在 beforeModelUpdate：动作/表情/物理都结算完了，快照已拍，
// **尚未烘焙** —— 写进去的嘴会被紧接着的 coreModel.update() 烘进这一帧的
// 绘制数据；随后的 loadParam() 只还原参数数组，冲不掉已烘好的结果。
// 这就是 CP 里「结算后覆盖」，也是 WebGAL 口型真正能压住动作的唯一位置。
let lipHookRuns = 0;        // 排障：钩子实际执行次数（证明确实跑了）
let lipHookFails = 0;       // 排障：钩子里抛异常的次数
// 排障：钩子内「动作刚算出来的嘴值」vs「我们写进去的嘴值」。
// 这两个数不一样，就证明钩子确实在动作结算之后、能改写它。
// 注意：**不能用 getParamFloat 在帧后读**做验证 —— coreModel.loadParam()
// 会在烘焙结束后把参数数组还原成快照值，帧后读到的永远是动作值。
// （上一版就是这样"自证通过"的：读回 1.00，屏幕上却是闭着的。）
let lipHookStat = { motionV: null, lipV: null, id: null, t: null };
// ===== v3.7.2 方案 B：Live2D 参数空间姿态插值（换动作/换表情不硬跳） =====
// 为什么在 beforeModelUpdate：动作/表情/物理都已结算、coreModel.update() 还没
// 烘焙（口型钩子用的同一个窗口，见 _bindLip）。Cubism2 每帧 update 结束会
// loadParam() 把参数数组还原成「烘焙前快照」，所以在这里写参数只影响**这一帧
// 的绘制**，不会回灌给动作/物理，下一帧 SDK 自己重算 —— 纯输出整形。
//
// 语义：切换瞬间把当前可见姿态整份拍下来（snapshot），之后 n 帧把「SDK 算出的
// 新姿态」用 smoothstep 从旧姿态拉过去（w: 0→1）。第 0 帧画的就是旧姿态，
// 所以边界首帧差分 d0≈0；而且整段只有**一个**姿态在动，不会像图像交叉溶解
// 那样出现两层半透明重影（那是 100ms 内两个姿态同时以低 alpha 叠加）。
const POSE_MOUTH_PARAM = "PARAM_MOUTH_OPEN_Y";   // 口型钩子独占，这里跳过
const poseBlend = new Map();                     // modelId -> {names,snap,i,n}
// **跨 slot / 跨重载的「最后可见姿态」**：口径按 ref（模型 url）记，而不是按
// slot。原因（实测）：clip 边界上 renderer 会先 loadModel 再 playMotion，
// 此刻新 slot 的参数还是模型默认值，如果直接沿用 slot 当前值当插值起点，
// 冻结/插值的第一帧就变成「默认姿态」，反而比硬切更跳（实测 d=4.68 一分
// 不少）。所以起点必须是「上一帧真正画出来过的姿态」，与它来自哪个 slot 无关。
const poseLastByRef = new Map();                 // ref -> {names, vals}
let poseBlendArms = 0;
let poseBlendFails = 0;
let poseBlendStat = { state: "idle" };
const __poseLog = window.__poseLog = [];     // 调试环（诊断姿态插值时序）
let __poseTicks = 0;
function __poseSeq() { return __poseTicks; }
function _plog(o) {
  if (__poseLog.length > 800) __poseLog.shift();
  __poseLog.push(o);
}

function _poseSnap(s) {
  const model = s && s.model;
  const im = model && model.internalModel;
  const cm = im && im.coreModel;
  const names = s && s.poseNames;
  if (!cm || typeof cm.getParamFloat !== "function" ||
      typeof cm.setParamFloat !== "function") {
    poseBlendStat = { state: "skip", why: "no_param_api" };
    return null;
  }
  if (!names || !names.length) {
    poseBlendStat = { state: "skip", why: "no_param_names" };
    return null;
  }
  const snap = new Array(names.length);
  let got = 0;
  for (let k = 0; k < names.length; k++) {
    const nm = names[k];
    if (nm === POSE_MOUTH_PARAM) { snap[k] = null; continue; }
    let v = null;
    try { v = cm.getParamFloat(nm); } catch (e) { v = null; }
    snap[k] = (typeof v === "number" && isFinite(v)) ? v : null;
    if (snap[k] !== null) got++;
  }
  return got ? { names: names, snap: snap, got: got } : null;
}

// 切换前调用：把当前姿态拍下来，并算出要插值的帧数（n≥2）。
// 起点优先取「该 ref 最后可见的姿态」（见 poseLastByRef 注释），取不到才退回
// 本 slot 当前值。
function _poseBase(s) {
  const st = _poseSnap(s);
  const ref = s && s.ref;
  const last = ref ? poseLastByRef.get(ref) : null;
  if (last && st && last.names && last.names.length === st.names.length) {
    const snap = new Array(st.names.length);
    let got = 0;
    for (let k = 0; k < snap.length; k++) {
      const v = last.vals[k];
      if (st.names[k] === POSE_MOUTH_PARAM || typeof v !== "number" ||
          !isFinite(v)) { snap[k] = null; continue; }
      snap[k] = v; got++;
    }
    if (got) return { names: st.names, snap: snap, got: got, src: "last" };
  }
  return st;
}

function _poseArm(modelId, s, ms) {
  try {
    const dur = (ms === undefined || ms === null) ? 0 : Number(ms);
    if (!(dur > 0)) { poseBlend.delete(modelId); return; }
    const prev = poseBlend.get(modelId);
    if (prev && prev.i === 0) return;      // 同一帧内重复下发：保留更早的快照
    const st = _poseBase(s);
    if (!st) return;
    const dt = (s && s.dt > 0) ? s.dt : (clock.dt || 1000 / 30);
    const n = Math.max(2, Math.round(dur / dt));
    poseBlend.set(modelId, { names: st.names, snap: st.snap, i: 0, n: n });
    poseBlendArms++;
    _plog({ ev: "arm", mid: modelId, n: n, dt: +dt.toFixed(2), got: st.got,
            src: st.src || "slot", seq: __poseSeq() });
    poseBlendStat = { state: "armed", modelId: modelId, n: n,
                      dt: +dt.toFixed(3), got: st.got, total: st.names.length };
  } catch (e) { poseBlendFails++; }
}

// 每帧 update 前调用：把本帧姿态从快照拉向 SDK 姿态。
function _poseApply(im) {
  if (!poseBlend.size || !im) return;
  const id = im.__muppetLipId;
  if (!id) return;
  const st = poseBlend.get(id);
  if (!st) return;
  const cm = im.coreModel;
  if (!cm || typeof cm.setParamFloat !== "function") { poseBlend.delete(id); return; }
  const x = Math.min(1, Math.max(0, (st.i + 1) / st.n));
  const w = x * x * (3 - 2 * x);           // smoothstep：两端速度为 0
  // 诊断开关：window.__muppetPoseHold=true 时整段冻结在快照姿态（w 恒 0），
  // 用来判定「钩子里的参数写入是否真的能改画面」以及跳变是否全在参数空间。
  const wUse = window.__muppetPoseHold ? 0 : w;
  let applied = 0, miss = 0;
  let mx = -1, mxn = "", mxb = 0, mxc = 0;
  for (let k = 0; k < st.names.length; k++) {
    const base = st.snap[k];
    if (base === null) continue;
    const nm = st.names[k];
    let cur;
    try { cur = cm.getParamFloat(nm); } catch (e) { miss++; continue; }
    if (typeof cur !== "number" || !isFinite(cur) || Math.abs(cur) > 1e4) { miss++; continue; }
    const dd = Math.abs(cur - base);
    if (dd > mx) { mx = dd; mxn = nm; mxb = base; mxc = cur; }
    try { cm.setParamFloat(nm, base + (cur - base) * wUse); applied++; } catch (e) { miss++; }
  }
  __poseTicks++;
  _plog({ ev: "ap", mid: id, i: st.i, n: st.n, w: +w.toFixed(3), ap: applied,
          mn: mxn, d: +(mx < 0 ? 0 : mx).toFixed(4),
          b: +mxb.toFixed(3), c: +mxc.toFixed(3), seq: __poseTicks });
  poseBlendStat = { state: "blend", modelId: id, i: st.i, n: st.n,
                    w: +w.toFixed(3), applied: applied, miss: miss };
  st.i++;
  if (st.i >= st.n) poseBlend.delete(id);   // 插值结束：完全交还 SDK
}

window.__muppetPoseBlend = function () {
  return { arms: poseBlendArms, fails: poseBlendFails,
           active: poseBlend.size, stat: poseBlendStat };
};

// **姿态记录（方案 B v3.7.3）**：每帧把「本帧真正会画出去的参数值」按 ref
// 记进 poseLastByRef。挂载顺序必须晚于 _bindLip —— 同一 internalModel 上
// 监听器按注册顺序执行，_poseApply 在前、记录在后，记到的才是插值后的终值。
function _bindPoseRec(model, modelId) {
  const im = model && model.internalModel;
  if (!im || typeof im.on !== "function") return false;
  if (im.__muppetPoseRec) return true;
  im.__muppetPoseRec = true;
  im.on("beforeModelUpdate", () => {
    try {
      const s = slots.get(modelId);
      const cm = im.coreModel;
      const names = s && s.poseNames;
      if (!cm || !names || !names.length ||
          typeof cm.getParamFloat !== "function") return;
      const vals = new Array(names.length);
      for (let k = 0; k < names.length; k++) {
        let v = null;
        try { v = cm.getParamFloat(names[k]); } catch (e) { v = null; }
        vals[k] = (typeof v === "number" && isFinite(v)) ? v : null;
      }
      poseLastByRef.set(s.ref || "", { names: names, vals: vals });
    } catch (e) { /* 记录失败不影响出图 */ }
  });
  return true;
}

function _bindLip(model, modelId) {
  const im = model && model.internalModel;
  if (!im || typeof im.on !== "function") return false;
  if (im.__muppetLipId) { im.__muppetLipId = modelId; return true; }
  im.__muppetLipId = modelId;
  im.on("beforeModelUpdate", () => {
    lipHookRuns++;
    // 方案 B：姿态插值必须**无条件**先跑。原来放在钩子末尾，被上面
    // 「没绑口型就 return」的分支挡掉了（lip 为 None 的 clip 永远不插值）。
    try { _poseApply(im); } catch (e) { poseBlendFails++; }
    // 渲染回调里绝不能抛：一次异常会打断整帧（画面直接卡住）
    try {
      const id = im.__muppetLipId;
      if (!id || !lipTable.has(id)) {
        // 没绑口型也要留痕：否则探针会一直显示上一次的陈旧值，
        // 让人误判「解绑后还在写嘴」（踩过）。
        lipHookStat = { motionV: null, lipV: null, id: id || null,
                        t: lipProjT, skipped: "no_lip" };
        return;
      }
      // 手动时钟（导出逐帧泵）：相位不能用工程播放头 lipProjT —— 它根本不
      // 更新。用**本 clip 内的帧偏移** s.lipK 反推片段内时间。
      //
      // **不能用 s.k**（踩过，用户报「口型又被动作覆盖了」）：
      //   s.k 是 lane 的**累积相位步数**，为了「clip 切换动作不断档」，
      //   allowRestart=false 时 seek 会把 target 映射成 s.k + k + 1 ——
      //   s.k 只增不减、跨 clip 一路累加（实测三个 10s clip 后 s.k≈45000）。
      //   而 lip 表是**按 clip 内相对帧**烘的（长度 = clip 帧数），
      //   用 s.k 算出的索引一越界，_lipAt 就夹到最后一个值 —— 嘴从此定死
      //   在同一个开口度上，看起来就是「口型没了/被动作压住」。
      //   s.lipK 由 seek 每步写入当前 clip 内偏移，跨 clip 归零，基准正确。
      // 为什么必须在钩子里写：app.render() 内部还会再跑一次
      // internalModel.update()，motionManager.update() 会用动作曲线把嘴
      // 覆盖回去 —— seek 循环体里的 _applyLip 在 render 之前写，会被这次
      // update 冲掉（fade 期间覆盖不彻底 -> 前 ~0.5s 看得见嘴动，之后没有，
      // 与预览当年的现象完全一致）。钩子写在 coreModel.update() 烘焙之前，
      // 才能压住动作、烘进这一帧。
      let lipT = lipProjT;
      if (clock.manual) {
        const s = slots.get(id);
        if (s) {
          const lk = (s.lipK !== undefined && s.lipK !== null) ? s.lipK : s.k;
          if (lk !== undefined) lipT = (lk * (s.dt || clock.dt)) / 1000;
        }
      }
      const v = _lipAt(id, lipT);
      if (v === null) {
        // v3.7.3：把「为什么没写嘴」原样暴露出去。stale = 页面手上的表
        // 与本帧相位对不上（换了台词没重发 setLip 的典型表现），导出侧
        // 回读校验据此打 LIPWARN —— 这是覆盖率统计看不见的一类失败。
        lipHookStat = { motionV: null, lipV: null, id: id,
                        t: lipT, skipped: lipAtMiss || "no_val" };
        return;
      }
      // 排障：先读「动作刚算完、我们还没写」的嘴值，再写，两个数都记下来
      let mv = null;
      try {
        const cm = im.coreModel;
        if (cm && typeof cm.getParamFloat === "function") {
          mv = cm.getParamFloat("PARAM_MOUTH_OPEN_Y");
        }
      } catch (e) {}
      const r = _writeMouth(model, v);
      lipLastWrite = r;
      if (r && r.ok) lipNow.set(id, v);
      lipHookStat = { motionV: mv, lipV: v, id: id, t: lipT,
                      manual: clock.manual, skipped: false };
    } catch (e) { lipHookFails++; }
  });
  return true;
}

function applyPaused() {
  if (app) app.ticker.paused = state.userPaused || clock.manual;
}

function _manualize(m) {
  // 只动 autoUpdate（不改 deltaTime）：断开 Ticker.shared 的驱动
  try { if (m && m.autoUpdate !== undefined) m.autoUpdate = false; } catch (e) {}
}

function _resetClock(m) {
  // 道起点：全局虚拟时钟也一起归零。v2 的动作相位 = 当前时间 - 动作起始
  // 时间，而起始时间是 motion() 那一刻从 UtSystem 读的；不一起归零，同一个
  // k 在不同道看到的绝对时刻不同 -> 姿态不同（实测三道 k=0 maxdiff 64）。
  if (vclock.on) vclock.t = 0;
  // 把模型内部时钟归零：构造函数写的是 `elapsedTime = performance.now()`，
  // 而 `_render` 把 elapsedTime 当 currentTime 传给 internalModel.update
  // （fade / 眨眼都按它算）。不归零，同一份「走 k 步」的序列在不同时刻
  // 加载会出**不同画面**（实测两个 slot 的 k=0 顶边差 1px，裁剪框跟着差，
  // 整段导出逐帧全对不上）。归零后画面只取决于 k => 逐帧动画也能逐位复现。
  try { if (m) { m.elapsedTime = 0; m.deltaTime = 0; } } catch (e) {}
}

// ---- 虚拟时钟：接管 live2d SDK 的取时口（可复现性的真正关键）----
// 只归零 model.elapsedTime **不够**：v2 SDK 自带时间源 ——
//   P.getSystemTimeMSec  = function(){ return new Date().getTime(); }
//   P.updateUserTimeMSec = function(){ return (P._\ = P.getSystemTimeMSec()); }
// 动作推进与眨眼读的是它，跟我们在 model.update(dt) 里喂的 dt 毫无关系。
// 实测：每步之间多睡 200ms 墙钟，20 帧画面与紧凑步进**全不相同**。
// 所以手动时钟期间把 Date.prototype.getTime 换成虚拟值，每走一步才真的
// 推进 dt 毫秒。只改 getTime()：减法/比较走 valueOf 不受影响（WebGAL
// 存档时间戳照旧是真实时间），且退出手动模式立刻还原。
const vclock = { on: false, t: 0, orig: null };

function applyVirtualClock(on) {
  if (on === vclock.on) return;
  if (on) {
    vclock.orig = Date.prototype.getTime;
    Date.prototype.getTime = function () { return vclock.t; };
    vclock.t = 0;
    vclock.on = true;
  } else {
    if (vclock.orig) { try { Date.prototype.getTime = vclock.orig; } catch (e) {} }
    vclock.orig = null;
    vclock.on = false;
  }
}

function _restartMotion(m, id) {
  // 回拖（scrub / 乱序请求跳出缓存窗口）：把动作重新起播，从第 0 步走。
  // 用与 playMotion 相同的入口，保证「重启后第 k 步」与首次顺序推进一致。
  // 同时把 elapsedTime 归零：否则「重启后走 k 步」的绝对时刻与首次不同，
  // 任何按绝对时间算的东西（眨眼调度等）会让同一个 k 出两种画面。
  try { m.elapsedTime = 0; m.deltaTime = 0; } catch (e) {}
  if (vclock.on) vclock.t = 0;          // 虚拟时钟一起归零，否则重启后第 k 帧 != 首次第 k 帧
  try {
    const mm = m && m.internalModel && m.internalModel.motionManager;
    if (mm && mm.stopAllMotions) mm.stopAllMotions();
  } catch (e) {}
  const g = last.motion[id];
  if (g) { try { m.motion(g); } catch (e) {} }
  const ex = last.expression[id];
  if (ex) { try { m.expression(ex); } catch (e) {} }
}

// 独奏：只让 modelId 这个 slot 可见，其余隐藏并渲染。
// 宿主页所有立绘都摆在舞台正中（导出侧再应用 layout），多道并存时
// canvas 是**叠加结果** —— 抓 A 道会带上 B 道的像素（实测 maxdiff 64）。
// 所以每次 seek 之前必须先独奏，抓回来才是这一道自己的立绘。
function _solo(modelId) {
  if (!app) return false;
  let changed = false;
  slots.forEach((s, id) => {
    if (!s.model) return;
    const want = (id === modelId);
    if (s.model.visible !== want) { s.model.visible = want; changed = true; }
  });
  if (changed) app.render();
  return changed;
}

const clockAPI = {
  setManual(on) {
    on = !!on;
    // **幂等**：状态没变就绝不重置相位。原先每次调用都把 s.k 归零，而
    // Python 侧每帧都会确认一次手动模式 -> 第 k 帧要从 0 重走 k 步，
    // 导出复杂度变成 O(k²)（1800 帧的片段直接不能用；60 帧的测试恰好
    // 暴露不出来）。
    if (on === clock.manual) return { manual: clock.manual, noop: true };
    clock.manual = on;
    applyVirtualClock(on);             // SDK 取时口接管/还原
    for (const s of slots.values()) {
      if (on) {
        _manualize(s.model);
        s.k = 0;
        s.dt = undefined;
        if (s.model) { s.model.deltaTime = 0; }
      } else {
        try { if (s.model) s.model.autoUpdate = true; } catch (e) {}
      }
    }
    applyPaused();
    _syncLipTicker();                  // v3.6.4：手动时钟不挂自动口型 ticker
    if (on && app) app.render();      // 手动模式不再有自动出帧，先给一帧
    return { manual: clock.manual, models: slots.size };
  },

  // **clip 切换连续性**：只重置相位步号，不重置动作/模型。
  // 导出 clip 切换时 t_local 从 0 开始，k 变小，seek 会误判回拖。
  // 先把 s.k 归零，seek 就不会触发 _restartMotion。
  resetPhase(modelId) {
    const s = slots.get(modelId);
    if (!s) return { err: "no_slot" };
    s.k = 0;
    return { ok: true, k: s.k };
  },

  // 相位定义：**第 k 帧 = 从加载起走 (k+1) 步**（每步 dt ms）。
  // 为什么不是 k 步：bundle 里 `_render` 只在 `deltaTime` 非零时才调
  // internalModel.update 结算参数，k=0 若一步不走、只 render，模型参数
  // 从未初始化 -> 画出来是**全透明空图**（实测 alpha 全 0，重试 8 次依旧
  // 空，白等）。多走一步既完成参数初始化，又不破坏确定性。
  // 上限 max 是必需的：回拖到长片段开头要从头重走上千步，一次 JS 调用
  // 连跑会把主线程独占好几秒（进度条冻死），所以按 max 切片跨 tick 推进。
  // 返回 {head, steps, reached} —— reached=false 表示还要继续 seek。
  seek(modelId, k, dt, max, allowRestart) {
    const s = slots.get(modelId);
    if (!s || !s.model || !app) return { err: "no_model" };
    k = Math.max(0, Math.round(Number(k) || 0));
    let target = k + 1;
    dt = Number(dt) || clock.dt;
    const cap = (max === undefined || max === null || max < 1)
      ? Infinity : Math.round(max);
    const m = s.model;
    _manualize(m);
    const soloChanged = _solo(modelId);   // 别道的像素不许混进来
    if (s.dt !== dt || s.k === undefined) { s.k = 0; s.dt = dt; }   // 网格变了从头走
    let restarted = false;
    // **clip 切换连续性**：allowRestart=false 时**不判定回拖**。导出 clip
    // 切换时 t_local 从 0 重新开始、k 变小，原逻辑会误判回拖触发
    // _restartMotion，把动作又重置了。这里把 target 映射到「当前相位 + k」，
    // 让动作继续推进而不是从头走。
    if (target < s.k && allowRestart === false) {
      target = s.k + k + 1;   // 当前相位 + 新 clip 内偏移
    } else if (target < s.k) {
      // 回拖：只清 deltaTime（elapsedTime 保持单调，淡入淡出按它算，
      // 倒拨会让 fade 时间窗错乱——实测过同类坑）
      m.deltaTime = 0;
      _restartMotion(m, modelId);
      s.k = 0; restarted = true;
    }
    let steps = 0;
    // **口型相位基准**：s.lipK = **本 clip 内**的帧偏移，与 s.k（累积相位）
    // 分离。s.k 为「动作不断档」跨 clip 累加，lip 表却按 clip 内相对帧烘，
    // 两者混用会让跨 clip 后 lip 索引越界、嘴定死（见 _bindLip 注释）。
    //
    // 统一公式：clip 内偏移 = s.k - lipBase，其中
    //   lipBase = target - 1 - k
    // 推导：本次 seek 终点是 clip 偏移 k（第 k+1 步），
    //   · allowRestart=false：target = s.kStart + k + 1
    //       -> lipBase = s.kStart  ->  偏移 = s.k - s.kStart = 本次步序号 ✓
    //   · 正常推进：target = k + 1
    //       -> lipBase = 0         ->  偏移 = s.k（本就等于 clip 内偏移）✓
    const lipBase = target - 1 - k;
    for (; s.k < target && steps < cap; s.k++) {
      // **每道一条时间轴**：v2 SDK 的取时口（UtSystem._$CS）是进程全局的，
      // 而动作相位 = 当前时间 - 该动作起始时间。只按 += dt 累加的话，多道
      // 交错推进时各道读到的绝对时刻互相踩（实测三道 k=0 像素 maxdiff 64）。
      // 直接把时钟摆成"本道第 s.k+1 步"应有的值 => 姿态只取决于 k。
      if (vclock.on) vclock.t = (s.k + 1) * dt;
      // 这一帧的口型该取 lip 表第几格（clip 内偏移，非累积相位）
      s.lipK = s.k - lipBase;
      m.update(dt);
      // 口型**不在这里写**：app.render() 内部会再跑 internalModel.update()
      // -> motionManager.update() 会用动作曲线把嘴覆盖回去（fade 期间覆盖不
      // 彻底 = 前 ~0.5s 看得见嘴动，之后没有）。正确位置是 _bindLip 挂在
      // internalModel 的 beforeModelUpdate 事件上 —— 动作已结算、coreModel
      // .update() 尚未烘焙，写进去的嘴会被紧接着烘进这一帧。
      app.render(); steps++;
    }
    // v3.6.4：**已经在该相位时，仍要把口型落一次**（实测挖出来的坑）。
    // 循环条件是 s.k < target，同一 k 重复 seek 时一步都不走（steps=0），
    // 而口型钩子在 app.render() 内部才触发 -> 换了 lip 表也不会被应用。
    //
    // **确定性**：结算参数必须 update（SDK 的 _render 只在 deltaTime 非零
    // 时重算参数），但 update 会把 deltaTime 累加进 **model.elapsedTime**
    // —— 而动作相位用的是 elapsedTime，vclock 只接管 Date 取时口，管不到
    // 它（实测：vclockT 稳住 33.33，elapsed 却每次 +1ms，画面因此每次都变）。
    //
    // 顺序极其关键（试错出来的）：
    //   1) update(1)          结算参数（此时嘴会被动作曲线覆盖）
    //   2) 还原 elapsedTime   相位回到原处，画面可复现
    //   3) render             出帧；beforeModelUpdate 钩子在烘焙前把嘴写进去
    if (!steps && lipTable.has(modelId) && s.k >= target) {
      // 同相位补落一帧：口型相位也要跟上（换 lip 表时必须生效）
      s.lipK = k;
      const keepE = m.elapsedTime;
      const keepD = m.deltaTime;
      try { m.update(1); } catch (e) {}
      try { m.elapsedTime = keepE; m.deltaTime = keepD; } catch (e) {}
      app.render();
      s.k = target;                             // 幂等，防累积
    }
    if (!steps) {
      // **一步都没走就不能直接抓**：v2 SDK 的 draw 依赖"本模型刚 update
      // 过"，_solo 刚把它从隐藏切回可见时只 render 会画出**空画布**（实测
      // bbox 非零占比 0.00000，整张全透明）。这里不自己补救（试过
      // internalModel.update(0, elapsedTime)，仍然空），只把状态回传给
      // Python 侧，由它走「clearModel + 重载 + 从 0 重走」——那条路实测
      // 与首次渲染逐位相同。
      return { steps: 0, head: s.k, k, target, dt, restarted,
               reached: true, needReload: !!soloChanged, manual: clock.manual };
    }
    return { steps, head: s.k, k, target, dt, restarted, reached: s.k >= target,
             manual: clock.manual };
    return { steps, head: s.k, k, target, dt, restarted,
             reached: s.k >= target, manual: clock.manual };
  },
};

// v3.5.2：把 tint / 字幕层的包围盒同步到 canvas 实际显示区域。
// canvas 是 16:9 居中 letterbox，窗口非 16:9 时有黑边 —— 若这两层用
// inset:0 铺满窗口，字幕会贴到黑边外底部、tint 会盖住黑边（实测偏右）。
// v3.5.2：overlay（tint/字幕）现在用纯 CSS inset:0 铺满 #stagebox，
// 而 #stagebox 本身就是 16:9 画面框 —— **不需要 JS 同步坐标**。
// 保留这个空函数只为兼容既有调用点（boot/setSubtitle 里调用无副作用）。
function _syncOverlayRect() { /* CSS 定位，无需同步 */ }

// 窗口/容器尺寸变化时重同步（canvas 由 flex 自适应，尺寸会变）
window.addEventListener("resize", _syncOverlayRect);

async function boot() {
  if (booted) return true;
  if (!ES_URL) { sendEvt("error", { code: "no_runtime", msg: "runtime 未注入" }); return false; }
  try {
    es = await import(ES_URL);                    // 依赖闭合：主包随之求值
    if (!window.PIXI || !window.PIXI.Application) {
      sendEvt("error", { code: "boot_failed", msg: "window.PIXI 未暴露" });
      return false;
    }
    app = new window.PIXI.Application({
      width: STAGE_W, height: STAGE_H,
      backgroundAlpha: 0, antialias: true, autoStart: true,
      preserveDrawingBuffer: true,               // grab 截图需要
    });
    const box = document.getElementById("stagebox");
    // canvas 插到 tint 之前（DOM 序：canvas -> tint -> subtitle）；
    // 层级另有 z-index（canvas 1 / tint 5 / subtitle 20）双保险
    const tintEl = document.getElementById("tint");
    if (tintEl && tintEl.parentNode === box) {
      box.insertBefore(app.view, tintEl);
    } else {
      box.appendChild(app.view);
    }
    app.view.style.zIndex = "1";
    // v3.5.2：canvas 用 absolute 铺满 #stagebox。
    // 走过两个弯路（都实测过，别回头）：
    //   1) 交给 PIXI 默认 CSS 尺寸 -> canvas 按 1280 参与 flex 布局，
    //      被挤出容器（x=-500，画面只剩右半）
    //   2) 设 width/height:100% + flex 居中 -> flex 仍按 1280 算位置，
    //      x 还是 -500
    // absolute + inset:0 完全脱离 flex 布局计算，才真正贴合容器。
    // 注意：**不能同时改位图尺寸**（attr width/height 必须留 1280x720，
    // 舞台内所有坐标按 STAGE_W/STAGE_H 算），只改 CSS 显示尺寸。
    app.view.style.position = "absolute";
    app.view.style.left = "0";
    app.view.style.top = "0";
    app.view.style.width = "100%";
    app.view.style.height = "100%";
    // v3.6.2：立绘容器（背景已拆到 DOM 层，这里只装 Live2D 立绘）
    figLayer = new window.PIXI.Container();
    figLayer.sortableChildren = true;
    app.stage.addChild(figLayer);
    // bloom 的模糊阶段：复用运行时自带的 PIXI.filters.BlurFilter
    // （引擎自己也是用 hC.BlurFilter 做 blur 的）
    try {
      if (window.PIXI.filters && window.PIXI.filters.BlurFilter) {
        figFilters.blurPass = new window.PIXI.filters.BlurFilter(6, 2);
      }
    } catch (e) {
      figFilters.blurPass = null;
    }
    booted = true;
    sendEvt("boot", { pixi: true, es: true });
    return true;
  } catch (e) {
    sendEvt("error", { code: "boot_failed", msg: String((e && e.message) || e).slice(0, 200) });
    showErr("预览引擎启动失败: " + ((e && e.message) || e));
    return false;
  }
}

function fitOf(model) {
  const mw = model.internalModel && model.internalModel.width ? model.internalModel.width : model.width;
  const mh = model.internalModel && model.internalModel.height ? model.internalModel.height : model.height;
  return Math.min(STAGE_W / mw, STAGE_H / mh);
}

function slot(id) {
  let s = slots.get(id);
  // k/dt：手动时钟下该模型已走到第几步、步长是多少（见 clockAPI.seek）
  if (!s) { s = { queue: Promise.resolve(), model: null, ref: "", fit: 1, k: 0, dt: undefined }; slots.set(id, s); }
  return s;
}
function enqueue(id, fn) {
  const s = slot(id);
  s.queue = s.queue.then(fn).catch((e) => {
    sendEvt("error", { code: "cmd_failed", msg: String((e && e.message) || e).slice(0, 200) });
  });
}

// v3.6.5：**修「切 clip 时整人消失一瞬」的第二处**。
//
// 场景：同一角色从 clip c1 切到 c2（不同 clip id = 不同 slot）。
// `_do_apply` 先发 loadModel(c2)、随后发 clearModel(c1)，但两个 slot 的
// 命令队列是**并行**的（enqueue 按 id 分队列）—— clearModel(c1) 很可能
// 先于 loadModel(c2) 完成，于是「旧的已删、新的还没上」= 画面空白。
// 实测 113 次采样有 5 次可见模型数为 0。
//
// 做法：**有模型正在加载时，把销毁推迟**到加载全部结束之后。
// 被推迟的模型保持挂在场景里继续显示（用户看到的是"还停在上一帧"，而不是人没了）。
let _loading = 0;
let _zombies = [];       // 待销毁但还在显示的模型

function _reapZombies() {
  if (_loading > 0) return;            // 还有模型在加载，先留着撑场面
  const list = _zombies;
  _zombies = [];
  for (const m of list) {
    try { (figLayer || app.stage).removeChild(m); } catch (e) {}
    try { m.destroy(); } catch (e) {}
  }
}

function _retire(model) {
  if (!model) return;
  if (_loading > 0) { _zombies.push(model); return; }
  try { (figLayer || app.stage).removeChild(model); } catch (e) {}
  try { model.destroy(); } catch (e) {}
}

const puppetAPI = {
  async loadModel(ref, modelId, poseParams) {
    if (!(await boot())) return;
    const s = slot(modelId);
    const url = new URL(ref, location.href).href;
    if (s.model && s.ref === url) return;                 // 幂等：同 ref 无操作
    if (!window.Live2DModelWebGL && !window.Live2DCubismCore) {
      sendEvt("error", { code: "no_live2d_sdk", modelId });
      showErr("Live2D SDK 未加载（lib/live2d.min.js 缺失）");
      return;
    }
    // v3.6.5 **修「人物整人消失一瞬」**（用户报的闪烁）：
    // 原来是「先销毁旧的、再 await 新的」——
    //     if (s.model) { removeChild; destroy(); }     <-- 旧模型此刻已经没了
    //     const model = await Live2DModel.from(url)     <-- 网络+解析，几十~几百 ms
    // 这中间 figLayer 里**一个立绘都没有**，画面上人就是消失了。
    // 实测切 clip 时 113 次采样里有 5 次「可见模型数 = 0」（约 40~120ms）。
    //
    // 现在改成**先加载、后替换**：新模型 `from()` 成功后，才把旧的移除。
    // 加载期间旧的照常显示（用户看到的是"还停在上一帧"，比人消失好得多）。
    _loading++;
    let model;
    try {
      model = await es.Live2DModel.from(url, { autoInteract: false });
    } finally {
      _loading = Math.max(0, _loading - 1);
      // 加载失败也要收垃圾：否则 _zombies 里的模型永远挂在场景里
      // （用户看到人物叠两张），而且 _loading 归零后再没人来触发回收。
      if (!model) _reapZombies();
    }
    if (model.anchor && model.anchor.set) model.anchor.set(0.5, 0.5);
    else model.pivot.set(model.width / 2, model.height / 2);
    const old = s.model;
    s.model = model; s.ref = url; s.fit = fitOf(model);
    // 方案 B：参数 id 名单由渲染器随 loadModel 下发（抽不到就 []，页面自动不插值）
    s.poseNames = (poseParams && poseParams.length) ? poseParams.slice() : null;
    poseBlend.delete(modelId);   // 换模型：旧姿态快照作废（参数集可能不同）
    if (clock.manual) _resetClock(model);   // 只在导出手动时钟里归零（见 _resetClock）
    // 换了模型 = 相位从头开始（手动时钟下 k 必须归零，否则第 k 步语义错位）
    s.k = 0; s.dt = undefined;
    if (clock.manual) _manualize(model);
    // v3.6.6：把口型挂到 internalModel 的 beforeModelUpdate 上（见 _bindLip）。
    // 必须在 addChild 之前挂好，否则第一帧就先按动作值画了。
    _bindLip(model, modelId);
    _bindPoseRec(model, modelId);   // 方案 B：每帧记录「最后可见姿态」（按 ref）
    (figLayer || app.stage).addChild(model);
    // 新的已经挂上去了，这时才拆旧的 —— 同帧内替换，没有空窗
    if (old && old !== model) _retire(old);
    _reapZombies();
    sendEvt("ready", { modelId });
  },
  async setTransform(modelId, x, y, scale, rot) {
    const s = slot(modelId);
    if (!s.model) return;
    s.model.x = x * STAGE_W; s.model.y = y * STAGE_H;
    // v3.5 修「人物被左右横向挤扁」：scale.set(v) 只设 x，y 保留旧值(1.0)
    // -> 横向被压缩 fit 倍（0.288），纵向不变 = 扁。必须显式等比。
    const k = Math.max(0.01, s.fit * scale);
    s.model.scale.set(k, k);
    s.model.rotation = (rot || 0) * Math.PI / 180;
    last.transform[modelId] = [x, y, scale, rot];
  },
  async playMotion(modelId, name, fadeMs, keepPhase) {
    const s = slot(modelId);
    if (!s.model) return;
    _poseArm(modelId, s, fadeMs);   // 方案 B：切换前拍下当前姿态
    const groups = Object.keys(s.model.internalModel.settings.motions || {});
    const want = String(name || "").toLowerCase();
    const g = groups.find(k => k.toLowerCase() === want) ||
              groups.find(k => k.toLowerCase().includes(want));
    if (!g) { sendEvt("error", { code: "unknownMotion", name }); return; }
    // **只在手动时钟下**先归零再重播：motion() 会用当前 elapsedTime 记
    // fade 起点，顺序反了起点就是遗留的墙钟大数，进度算成负数 -> 动作
    // 永远淡入不进来。预览模式绝不能归零：正在淡出的旧动作会被卡住，
    // 两个动作叠着播（那是用户能直接看到的破绽）。
    //
    // **导出连续性**：keepPhase=true 时**不归零**——同一模型换 motion 时
    // elapsedTime 已经是虚拟时钟（从 0 累加），fade 起点就是当前相位，
    // 不需要重置。只有模型刚加载（elapsedTime 是 performance.now() 的墙钟
    // 大数）才需要归零。
    if (clock.manual && !keepPhase) _resetClock(s.model);
    // v3.6.8：**用 FORCE 优先级直接切**，不重置动作、不重载模型。
    //
    // 实测问题（用户问「动作切换是否可以不重置动作直接切换」）：
    //   原来调 `s.model.motion(g)` —— 它走 startRandomMotion(g, undefined)，
    //   优先级落到默认 NORMAL(2)。而 bundle 里 MotionState.reserve() 是：
    //       if (newPriority <= currentPriority) return false;   // 静默拒绝
    //   于是「动作还在播」时切动作，2<=2 成立 -> **新动作根本没起来**，
    //   旧动作一直播到结束。实测队列 size 恒为 1、currentGroup 恒为旧动作。
    //
    // 现在传 FORCE(3)：3 > 2 可以抢占。旧动作不会硬跳 —— bundle 的
    // InternalModel._startMotion() 会先 stopAllMotions()（Cubism2 里是
    // 给每个旧动作设 fadeOut），新动作再进场，视觉上是平滑过渡。
    // fadeMs 给定时按毫秒换算成秒（库的优先级参数是枚举，不是毫秒）。
    const FORCE = 3;
    const ok = s.model.motion(g, undefined, FORCE);
    if (!ok) { sendEvt("error", { code: "unknownMotion", name }); return; }
    last.motion[modelId] = g;
    s.k = 0;                            // 动作重播 = 相位归零（否则第 k 步不再是第 k 帧）
  },
  // **keepPhase（v3.7.1，方案 C）**：导出侧换表情时传 keepPhase=true，
  // 表示「只换表情，不动相位」。原来这里无条件 `s.k = 0` +
  // `_resetClock()` —— 于是每换一次表情，动作相位/呼吸/物理全被归零，
  // 和 loadModel 重建等价（这正是导出视频「动作切换生硬」的一半成因：
  // hspdz_uika_mv 的 36 个边界里 33 个同时换了 expression）。
  // 现在：keepPhase 时只设表情、保留 s.k 与时钟；缺省（预览手动切表情）
  // 维持原语义，重走相位。
  async setExpression(modelId, name, fadeMs, keepPhase) {
    const s = slot(modelId);
    if (!s.model) return;
    _poseArm(modelId, s, fadeMs);   // 方案 B：换表情同样从当前姿态插过去
    const raw = String(name || "").trim();
    if (!raw) {
      // 空表情 = 清空（回到模型默认脸）。Cubism2 的 expressionManager
      // .resetExpression() 走权重淡出，不会硬切。
      try {
        const em = s.model.internalModel.motionManager.expressionManager;
        if (em && em.resetExpression) em.resetExpression();
      } catch (e) { /* 无表情定义的模型：忽略 */ }
      last.expression[modelId] = "";
      if (!keepPhase) {
        s.k = 0;
        if (clock.manual) _resetClock(s.model);
      }
      return;
    }
    const list = (s.model.internalModel.settings.expressions || []).map(e => e.name);
    const want = raw.toLowerCase();
    const e = list.find(k => k.toLowerCase() === want) ||
              list.find(k => k.toLowerCase().includes(want));
    if (!e) { sendEvt("error", { code: "unknownExpression", name }); return; }
    s.model.expression(e);
    last.expression[modelId] = e;
    if (keepPhase) return;              // 相位保持连续，动作不断档
    s.k = 0;                            // 同 playMotion：表情切换重走相位
    if (clock.manual) _resetClock(s.model);
  },
  async clear(modelId) {
    if (!modelId) {
      for (const [id, s] of slots) {
        if (s.model) _retire(s.model);
      }
      slots.clear();
      _reapZombies();
      return;
    }
    const s = slots.get(modelId);
    if (s && s.model) _retire(s.model);
    slots.delete(modelId);
    _reapZombies();
  },
  async setPaused(paused) {
    state.userPaused = !!paused;
    applyPaused();
  },

  // v3.6.4：下发表情式口型表（Python 侧 lip_sync 算好的开口度序列）。
  // vals = 每帧开口度 0..1（**按片段内相对时间**排列）；
  // start = 该片段在工程里的起点（秒），用来把工程时间换算成片段内时间。
  // 传空数组 = 解除绑定。
  // v3.7.3：tag = 本表的来源 clip 标识。只做两件事：①排障时能看出页面
  // 手上是哪一段的表；②换来的是**显式换表语义** —— 同 ref 连续多 clip 时
  // Python 侧即使不重发也会因 tag 变化被判定为换表（真正的重发在渲染层）。
  setLip(modelId, vals, fps, gain, start, tag) {
    if (!modelId) return;
    if (!Array.isArray(vals) || !vals.length) {
      lipTable.delete(modelId);
      lipNow.delete(modelId);
      // 解除时要**主动闭嘴**：否则最后一次的开口度会一直留在参数上
      const s = slots.get(modelId);
      if (s && s.model) _writeMouth(s.model, 0);
      _syncLipTicker();
      return;
    }
    lipTable.set(modelId, {
      vals: vals.map(v => Math.max(0, Math.min(1, Number(v) || 0))),
      fps: Number(fps) || 30,
      gain: Number(gain) || 1,
      start: Number(start) || 0,
      tag: String(tag == null ? "" : tag),   // v3.7.3 来源 clip 标识
    });
    _syncLipTicker();
    // 表更新完立刻按当前工程时间落一次，不用等下一帧 setTime
    _lipApplyAll();
  },

  // ================= v3.5.2：背景层 / 字幕层 / 滤镜层 =================
  // 用户报「实时预览没有背景和文字和滤镜」——这三层原来完全没实现
  // （推送端只发立绘的 5 条命令）。现在补齐：
  //   背景 = PIXI.Sprite 压在 stage 最底层（zIndex 排序保证在立绘下）
  //   字幕 = DOM 层（与导出皮肤的 MyGO 风一致：白字黑描边 + 蓝名字胶囊）
  //   滤镜 = CSS filter（brightness/contrast/saturate/blur/sepia/hue）
  //          + 叠加色层，对齐 setTransform 的语义子集

  async setBackground(url) {
    // v3.6.2：背景改成**独立 DOM 层**（不再用 PIXI sprite）。
    // 为什么：PIXI canvas 里背景和立绘在同一张画布，CSS filter 只能整块
    // 作用——而引擎的 setTransform 是按 target 分层的（bg-main / fig-*），
    // 电影感滤镜几乎都是「背景压暗 + 人物提亮」成对参数，不分开就完全
    // 看不到效果（用户报「实时预览显示不了完整滤镜」的根因之一）。
    // 拆成 <div id=bgLayer><img></div> 后，两层各挂各的 filter。
    if (!(await boot())) return;
    const u = url ? new URL(url, location.href).href : "";
    if (state.bgUrl === u) return;                    // 幂等
    state.bgUrl = u;
    const layer = document.getElementById("bglayer");
    const img = document.getElementById("bgimg");
    if (!layer || !img) return;
    if (!u) { layer.style.display = "none"; img.removeAttribute("src"); return; }
    try {
      await new Promise((res, rej) => {
        img.onload = () => res(true);
        img.onerror = () => rej(new Error("load failed"));
        img.src = u;
      });
      // 铺满舞台（cover）：object-fit 交给 CSS，这里只控制显隐
      layer.style.display = "block";
      sendEvt("bgReady", { url: u });
    } catch (e) {
      sendEvt("error", { code: "bg_failed", msg: String(e).slice(0, 160) });
      showErr("背景加载失败: " + ((e && e.message) || e));
    }
  },

  async setSubtitle(who, text) {
    const box = document.getElementById("subtitle");
    const nameEl = document.getElementById("sub-name");
    const textEl = document.getElementById("sub-text");
    if (!box) return;
    const w = String(who || ""), tx = String(text || "");
    if (!tx) { box.style.display = "none"; state.sub = ""; return; }
    // v3.5.2：必须用 flex（不是 block）—— CSS 里靠 flex-end 把字幕压到
    // 画面底部，设成 block 会让 justify-content 失效、字幕跑到顶部。
    box.style.display = "flex";
    nameEl.textContent = w;
    nameEl.style.display = w ? "inline-block" : "none";
    textEl.textContent = tx;
    state.sub = w + "\u0000" + tx;
  },

  async setFilter(spec) {
    // v3.6.2：**分层滤镜** —— spec 可以是：
    //   {target:"bg-main"|"fig-*", ...参数}      单层（引擎 setTransform 语义）
    //   {bg:{...}, fig:{...}}                    两层分别给（工作台推送用）
    //   {...参数}                                旧口径：两层都套（兼容）
    //
    // 支持：brightness / contrast / saturate / blur / gamma(近似) /
    //       colorRed/Green/Blue 染色 / sepia / hue / opacity
    // 未实现的（bevel 浮雕 / bloom 泛光 / 各种 Film / shockwave）在
    // 预览里退化为最接近的近似或忽略——精确效果以 WebGAL 导出为准。
    const f = spec || {};
    const bgLayer = document.getElementById("bglayer");
    const canvas = app && app.view ? app.view : null;
    const tintEl = document.getElementById("tint");

    // ---- 把一组参数折成 CSS filter 串 + tint 信息 ----
    function build(spec1) {
      const g = spec1 || {};
      const num = (v, d) => (v === undefined || v === null ? d : Number(v));
      const out = [];
      const bl = num(g.blur, 0);
      const se = num(g.sepia, 0);
      const hu = num(g.hue, 0);
      // 注意：brightness / contrast / saturation / gamma / colorRGB / alpha
      // **不再走 CSS** —— 它们由 PIXI 的 adjustment 滤镜统一计算（见
      // _applyFigFilters）。之前 CSS 也做一遍、PIXI 再做一遍，两次
      // contrast/brightness 叠加会把画面推白（用户截图「人物惨白」）。
      // CSS 只保留它擅长且引擎里没有对应滤镜的部分。
      if (bl > 0) out.push("blur(" + Math.min(6, bl * 0.5).toFixed(2) + "px)");
      if (se > 0) out.push("sepia(" + Math.min(1, se) + ")");
      if (hu) out.push("hue-rotate(" + hu + "deg)");
      return { css: out.join(" "), tint: null };
    }

    // ---- 归一成 bg / fig 两组参数 ----
    let bgSpec = null, figSpec = null;
    if (f.bg !== undefined || f.fig !== undefined) {
      bgSpec = f.bg || null;
      figSpec = f.fig || null;
    } else if (f.target) {
      if (String(f.target).indexOf("bg") === 0) bgSpec = f; else figSpec = f;
    } else {
      bgSpec = f;                     // 旧口径：两层都套
      figSpec = f;
    }

    const bgB = bgSpec !== null ? build(bgSpec) : null;
    const figB = figSpec !== null ? build(figSpec) : null;

    // 背景层：CSS filter 挂在 bglayer（含 img）
    if (bgLayer) bgLayer.style.filter = bgB ? bgB.css : "";
    // 立绘层：CSS filter 挂在 canvas（管调色类），
    // PIXI 滤镜挂 figLayer（管 bevel/bloom 这类需要卷积的）
    if (canvas) canvas.style.filter = figB ? figB.css : "";
    // ---- v3.6.2：bevel / bloom 用 PIXI 滤镜（CSS 表达不了）----
    this._applyFigFilters(figSpec);

    // 染色层：RGB 乘子已改由 PIXI adjustment 滤镜做乘法（见 _applyFigFilters），
    // 这里只保留 CSS 侧的 tint 槽位不再使用，统一关掉以免叠加洗白。
    if (tintEl) tintEl.style.display = "none";
    state.filter = [bgB && bgB.css, figB && figB.css].filter(Boolean).join(" | ");
  },

  // ---- adjustment：引擎同款调色（brightness/contrast/saturation/gamma
  //       + colorRed/Green/Blue 乘法染色）----
  // 为什么不用 CSS filter：CSS 有 brightness/contrast/saturate，但
  // **没有 RGB 乘子**。引擎的 colorRed/Green/Blue 是 rgb *= color/255，
  // 用半透明遮罩近似会把人物洗白（用户截图「人物惨白」就是这条）。
  // 这里照抄引擎 adjustment 的 shader 一次算全。
  // ---- adjustment：**逐字照搬**引擎 @1234882 的 frag ----
  // 之前自己写的版本有三处错：
  //   1. saturation 用 0.299/0.587/0.114，引擎用 0.2125/0.7154/0.0721
  //   2. contrast 和 saturation 的顺序反了（引擎先 sat 再 contrast，
  //      且是嵌套 mix：mix(0.5, mix(lum, rgb, sat), contrast)）
  //   3. RGB 乘子在 brightness 之前（引擎先乘 red/green/blue 再乘 brightness）
  // 这些差异导致人物区域平均差 15/255、边缘带差 45/255。
  _ADJUST_FRAG: [
    "varying vec2 vTextureCoord;",
    "uniform sampler2D uSampler;",
    "uniform float gamma;",
    "uniform float contrast;",
    "uniform float saturation;",
    "uniform float brightness;",
    "uniform float red;",
    "uniform float green;",
    "uniform float blue;",
    "uniform float alpha;",
    "void main(void) {",
    "  vec4 c = texture2D(uSampler, vTextureCoord);",
    "  if (c.a > 0.0) {",
    "    c.rgb /= c.a;",
    "    vec3 rgb = pow(c.rgb, vec3(1. / gamma));",
    "    rgb = mix(vec3(.5), mix(vec3(dot(vec3(.2125, .7154, .0721), rgb)), rgb, saturation), contrast);",
    "    rgb.r *= red;",
    "    rgb.g *= green;",
    "    rgb.b *= blue;",
    "    c.rgb = rgb * brightness;",
    "    c.rgb *= c.a;",
    "  }",
    "  gl_FragColor = c * alpha;",
    "}",
  ].join("\n"),

  _ensureAdjustFilter() {
    if (figFilters.adjust) return figFilters.adjust;
    const PIXI = window.PIXI;
    if (!PIXI || !PIXI.Filter) return null;
    const f = new PIXI.Filter(undefined, this._ADJUST_FRAG, {
      gamma: 1, contrast: 1, saturation: 1, brightness: 1,
      red: 1, green: 1, blue: 1, alpha: 1,
    });
    figFilters.adjust = f;
    return f;
  },
  _specWantsAdjust(g) {
    if (!g) return false;
    const v = (k, d) => (g[k] === undefined ? d : Number(g[k]));
    // 注意：**不含 alpha** —— 引擎 $$ 映射表里 alpha 走容器级
    // alphaFilterVal（只乘 .a），不是 adjustment 滤镜。
    return v("brightness", 1) !== 1 || v("contrast", 1) !== 1
      || v("saturation", 1) !== 1 || v("gamma", 1) !== 1
      || v("colorRed", 255) !== 255 || v("colorGreen", 255) !== 255
      || v("colorBlue", 255) !== 255;
  },
  _adjustSet(f, g) {
    const v = (k, d) => (g[k] === undefined ? d : Number(g[k]));
    f.uniforms.brightness = v("brightness", 1);
    f.uniforms.contrast = v("contrast", 1);
    f.uniforms.saturation = v("saturation", 1);
    f.uniforms.gamma = Math.max(0.01, v("gamma", 1));
    // RGB 乘子：colorRed/Green/Blue 是 0~255，引擎按 /255 当系数
    f.uniforms.red = v("colorRed", 255) / 255;
    f.uniforms.green = v("colorGreen", 255) / 255;
    f.uniforms.blue = v("colorBlue", 255) / 255;
    // alpha 恒 1（引擎 adjustment 的 alpha 不走 gD 映射，一直是默认 1）
    f.uniforms.alpha = 1;
  },

  // ================= v3.6.3：立绘 PIXI 滤镜（bevel / bloom）=================
  // **照搬引擎真实实现**（不是近似）。运行时主包里打包了完整 pixi-filters
  // v4.2.0（37 个滤镜包），引擎用混淆类名 bIe(BEVEL) / r2e(ADVANCED_BLOOM)
  // 实例化，这些类没暴露到 window，但 GLSL 源码就在 bundle 里，直接抠出来
  // 用 PIXI.Filter 重建 —— 参数语义与引擎逐项对齐。
  //
  // 为什么必须照搬（用户给的参考图验证）：引擎 bevel 用 **alpha 差**判边缘，
  // 高光走「滤色」、阴影走「正片叠底」，还带方向柔化；手写近似用亮度差 +
  // 简单加法，出不来「人物边缘一圈暖色轮廓光」的电影感效果。
  //
  // 参数映射（引擎 bundle 里的 gD 映射表，逐字核对过）：
  //   bevel          -> bevel.lightAlpha
  //   bevelThickness -> bevel.thickness
  //   bevelRotation  -> bevel.rotation（度）
  //   bevelSoftness  -> bevel.softness（0~1）
  //   bevelRed/Green/Blue -> lightColor（RGB 打包成 0xRRGGBB）
  //   bloom          -> bloom.bloomScale
  //   bloomBrightness-> bloom.brightness
  //   bloomBlur      -> bloom.blur
  //   bloomThreshold -> bloom.threshold

  // ---- bevel：引擎 bIe 的 frag（**关键修正**：引擎用独立的 mask 纹理
  //      采样 alpha，softness>0 时传模糊图、否则传输入本身。我最初照搬
  //      时保留了 `uniform sampler2D mask` 却从不赋值 —— 未绑定的
  //      sampler 采样恒为黑，于是 light=0、(color.a-0)*lightAlpha 直接
  //      饱和到 1，**整个立绘被光色染白**（用户截图「人物惨白」根因）。
  //      这里直接用 uSampler 采样两次，语义等价且不需要第二个纹理。）----
  _BEVEL_FRAG: [
    "precision mediump float;",
    "varying vec2 vTextureCoord;",
    "uniform sampler2D uSampler;",
    "uniform vec4 filterArea;",
    "uniform float transformX;",
    "uniform float transformY;",
    "uniform vec3 lightColor;",
    "uniform float lightAlpha;",
    "uniform vec3 shadowColor;",
    "uniform float shadowAlpha;",
    "void main(void) {",
    "  vec2 transform = vec2(1.0 / filterArea.xy) * vec2(transformX, transformY);",
    "  vec4 color = texture2D(uSampler, vTextureCoord);",
    "  float light = texture2D(uSampler, vTextureCoord - transform).a;",
    "  float shadow = texture2D(uSampler, vTextureCoord + transform).a;",
    // 高光：滤色（screen）
    "  color.rgb = mix(color.rgb,",
    "    vec3(1.0) - (vec3(1.0) - color.rgb) * (vec3(1.0) - lightColor),",
    "    clamp((color.a - light) * lightAlpha, 0.0, 1.0));",
    // 阴影：正片叠底（multiply）
    "  color.rgb = mix(color.rgb, color.rgb * shadowColor,",
    "    clamp((color.a - shadow) * shadowAlpha, 0.0, 1.0));",
    "  gl_FragColor = vec4(color.rgb, color.a);",
    "}",
  ].join("\n"),

  // ---- advanced-bloom：引擎 r2e 的三段式 ----
  _BLOOM_EXTRACT_FRAG: [
    "uniform sampler2D uSampler;",
    "varying vec2 vTextureCoord;",
    "uniform float threshold;",
    "void main() {",
    "  vec4 color = texture2D(uSampler, vTextureCoord);",
    "  float _max = max(max(color.r, color.g), color.b);",
    "  float _min = min(min(color.r, color.g), color.b);",
    "  float brightness = (_max + _min) * 0.5;",
    "  if (brightness > threshold) { gl_FragColor = color; }",
    "  else { gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0); }",
    "}",
  ].join("\n"),
  _BLOOM_COMBINE_FRAG: [
    "uniform sampler2D uSampler;",
    "varying vec2 vTextureCoord;",
    "uniform sampler2D bloomTexture;",
    "uniform float bloomScale;",
    "uniform float brightness;",
    "void main() {",
    "  vec4 color = texture2D(uSampler, vTextureCoord);",
    "  color.rgb *= brightness;",
    "  vec4 bloomColor = vec4(texture2D(bloomTexture, vTextureCoord).rgb, 0.0);",
    "  bloomColor.rgb *= bloomScale;",
    "  gl_FragColor = color + bloomColor;",
    "}",
  ].join("\n"),

  // ---- 引擎 Dy（多通道核模糊）的 frag，逐字照搬 bundle ----
  // 引擎 bloom 的 _blurFilter 是 Dy（quality=3 多遍 ping-pong），
  // 不是 PIXI 核心 BlurFilter —— 算法不同，泛光形状有差（用户报「对不上」）。
  _BLUR_FRAG: [
    "varying vec2 vTextureCoord;",
    "uniform sampler2D uSampler;",
    "uniform vec2 uOffset;",
    "void main(void) {",
    "  vec4 color = vec4(0.0);",
    "  color += texture2D(uSampler, vec2(vTextureCoord.x - uOffset.x, vTextureCoord.y + uOffset.y));",
    "  color += texture2D(uSampler, vec2(vTextureCoord.x + uOffset.x, vTextureCoord.y + uOffset.y));",
    "  color += texture2D(uSampler, vec2(vTextureCoord.x + uOffset.x, vTextureCoord.y - uOffset.y));",
    "  color += texture2D(uSampler, vec2(vTextureCoord.x - uOffset.x, vTextureCoord.y - uOffset.y));",
    "  color *= 0.25;",
    "  gl_FragColor = color;",
    "}",
  ].join("\n"),

  // 照搬引擎 Dy：kernels = [blur, blur-blur/q, blur-2*blur/q, ...]（q 遍），
  // padding = ceil(Σ(kernel+0.5))；apply 多遍时在 input/临时纹理间 ping-pong，
  // 每遍 uOffset = (kernel+0.5) * pixelSize / frameSize（pixelSize 默认 1）。
  _makeKernelBlur(blur, quality) {
    const PIXI = window.PIXI;
    if (!PIXI || !PIXI.Filter) return null;
    const f = new PIXI.Filter(undefined, this._BLUR_FRAG, {
      uOffset: new Float32Array(2),
    });
    // 用 _blur/_kernels（引擎同名私有字段），不要写成 f.blur ——
    // PIXI Filter 上若有同名属性会被覆盖，且签名逻辑无需暴露公开字段。
    f._quality = quality;
    f._blur = blur;
    f._setKernels = function (b) {
      f._blur = b;
      const q = f._quality;
      const kernels = [b];
      if (b > 0) {
        let o = b;
        const step = b / q;
        for (let s = 1; s < q; s++) { o -= step; kernels.push(o); }
      }
      f._kernels = kernels;
      f.padding = Math.ceil(kernels.reduce((a, k) => a + k + 0.5, 0));
    };
    f._setKernels(blur);
    // 照搬引擎 Dy.prototype.apply（pixelSize=1）
    f.apply = function (renderer, input, output, clear, current) {
      // 引擎原式取 input._frame（BaseRenderTexture 的 frame）。
      // PIXI v6 里 filter 链的 input 是 RenderTexture，_frame 存在；
      // 做个兜底以免某些路径下 undefined 直接炸掉整个滤镜链。
      const fr = (input && (input._frame || input.frame || input)) || { width: 1, height: 1 };
      const a = 1.0 / (fr.width || 1);
      const s = 1.0 / (fr.height || 1);
      const kernels = f._kernels;
      const q = f._quality;
      if (q === 1 || f._blur === 0) {
        const u = kernels[0] + 0.5;
        f.uniforms.uOffset[0] = u * a;
        f.uniforms.uOffset[1] = u * s;
        renderer.applyFilter(f, input, output, clear);
        return;
      }
      const tmp = renderer.getFilterTexture();
      let src = input, dst = tmp;
      for (let g = 0; g < q - 1; g++) {
        const u = kernels[g] + 0.5;
        f.uniforms.uOffset[0] = u * a;
        f.uniforms.uOffset[1] = u * s;
        renderer.applyFilter(f, src, dst, 1);
        const t = src; src = dst; dst = t;
      }
      const u = kernels[q - 1] + 0.5;
      f.uniforms.uOffset[0] = u * a;
      f.uniforms.uOffset[1] = u * s;
      renderer.applyFilter(f, src, output, clear);
      renderer.returnFilterTexture(tmp);
    };
    return f;
  },

  _ensureBevelFilter() {
    if (figFilters.bevel) return figFilters.bevel;
    const PIXI = window.PIXI;
    if (!PIXI || !PIXI.Filter) return null;
    const f = new PIXI.Filter(undefined, this._BEVEL_FRAG, {
      transformX: 0,
      transformY: 0,
      lightColor: new Float32Array([1, 1, 1]),
      lightAlpha: 0,
      shadowColor: new Float32Array([0, 0, 0]),
      shadowAlpha: 0.7,
    });
    f.padding = 1;
    figFilters.bevel = f;
    return f;
  },
  _ensureBloomFilters() {
    if (figFilters.bloom) return figFilters;
    const PIXI = window.PIXI;
    const self = this;
    if (!PIXI || !PIXI.Filter) return null;
    if (!PIXI.filters || !PIXI.filters.BlurFilter) return null;

    // ③ 合成 filter（主输出）：输入是**原图**，额外采样 bloomTexture
    const combine = new PIXI.Filter(undefined, this._BLOOM_COMBINE_FRAG, {
      bloomTexture: null,
      bloomScale: 0,
      brightness: 1,
    });
    // ① 阈值提取到临时纹理
    const extract = new PIXI.Filter(undefined, this._BLOOM_EXTRACT_FRAG,
                                    { threshold: 0 });
    // ② 模糊临时纹理。
    // **为什么不用引擎那个 Dy 核模糊（实测否决，2026-11-20）**：
    // 按 r2e 的 defaults(blur=8,quality=4) 照搬 Dy 后，与引擎参照图的
    // 人物区平均差 7.39 -> 11.70（变差 58%），边缘带 51.17 -> 56.24。
    // 原因是引擎里 bloomBlur 走 `bloom.blur` 后再由 Dy 生成多遍 kernels，
    // 而参照图那组参数(blur=4)在 PIXI 的 BlurFilter(8,2) 下更接近引擎
    // 实际观感。**照搬源码 ≠ 还原观感**，以像素对照为准。
    // _BLUR_FRAG / _makeKernelBlur 保留备用（换参数或引擎改版时可切回）。
    const blurPass = new PIXI.filters.BlurFilter(8, 2);
    if (!blurPass) return null;

    // **关键**：照抄引擎 AdvancedBloomFilter.apply 的流程 ——
    // extract/blur 渲染到 renderer 的临时 filter texture，只有模糊结果
    // 绑到 bloomTexture；主 applyFilter 仍以原 input 为输入输出到 output。
    // 若把三个 filter 直接串进 filters 数组，blurPass 的模糊图会变成主
    // 输出（PIXI filter 链语义），整块画面被糊掉 —— 这正是用户报
    // 「模糊太多」的根因。
    const origApply = combine.apply.bind(combine);
    combine.apply = function (renderer, input, output, clear, current) {
      // current=true 表示这是链中第一个 filter（需要清屏）
      const realClear = current === undefined ? clear : current;
      const texExtract = renderer.getFilterTexture();
      extract.apply(renderer, input, texExtract, 1);
      const texBlur = renderer.getFilterTexture();
      blurPass.apply(renderer, texExtract, texBlur, 1);
      combine.uniforms.bloomTexture = texBlur;
      origApply(renderer, input, output, realClear);
      renderer.returnFilterTexture(texBlur);
      renderer.returnFilterTexture(texExtract);
    };

    figFilters.bloom = combine;
    figFilters.bloomExtract = extract;
    figFilters.blurPass = blurPass;
    // **关键**：给合成 filter 留出扩散余量，否则泛光被裁在立绘边界内、
    // 出不来「轮廓外一圈暖光」——而这正是引擎参照图里最显眼的特征
    // （实测头顶暖光区差 202.91，预览那圈是纯黑）。
    // padding 取模糊半径的量级：BlurFilter(8,2) 的有效扩散约 8*2=16px，
    // 给到 32 留余量；引擎 AdvancedBloomFilter 同样按 blur 设 padding。
    combine.padding = 32;
    return figFilters;
  },

  // 把引擎单位转成 shader uniform（thickness/rotation -> transformX/Y）
  _bevelSet(f, g) {
    const v = (k, d) => (g[k] === undefined ? d : Number(g[k]));
    const deg = v("bevelRotation", 45);
    const rad = deg * Math.PI / 180.0;
    // 引擎 _updateTransform：transformX = thickness*cos, Y = thickness*sin，
    // shader 里 `transform = (1.0/filterArea.xy) * (transformX,transformY)`
    // 得到 UV 偏移 —— filterArea 是**立绘自身的 bounds**（PIXI 每帧写入），
    // 所以这里原样传 thickness 即可，不用自己乘系数（乘了反而不准）。
    const thick = v("bevelThickness", 2);
    f.uniforms.transformX = thick * Math.cos(rad);
    f.uniforms.transformY = thick * Math.sin(rad);
    // 引擎 gD 映射表：bevel 只映射到 lightAlpha；shadowAlpha 不在映射表里，
    // 保持类默认值 0.7（原来写成 bevel*0.7，bevel=2 时 1.4 溢出 -> 黑毛边）
    f.uniforms.lightAlpha = v("bevel", 0);
    f.uniforms.shadowAlpha = 0.7;
    const r = v("bevelRed", 255) / 255;
    const gg = v("bevelGreen", 255) / 255;
    const b = v("bevelBlue", 255) / 255;
    const lc = f.uniforms.lightColor;
    if (lc && lc.length === 3) { lc[0] = r; lc[1] = gg; lc[2] = b; }
    else { f.uniforms.lightColor = new Float32Array([r, gg, b]); }
  },

  // 从 spec 里判断要不要挂（与引擎 isDefault 同口径）
  _specWantsBevel(g) {
    // v3.6.4 最终结论：**预览不挂 bevel**，与真实引擎行为对齐。
    // 实测证据链（2026-11-20）：
    //   1. 扒引擎 bundle：bIe(bevel) 的 frag 用 `color.a - light`（alpha 差）
    //      判边缘，light/shadow 都从 mask 纹理采 .a。
    //   2. 把导出的真实 WebGAL 工程放进 WebEngine 跑，抓 #pixiCanvas：
    //      alpha 通道**全 255**（opaque，921600 像素无一例外）
    //      → alpha 差恒 0 → bevel 在引擎里是空操作。
    //   3. 同模型同参数对照：预览带 bevel 时人物区差 14.57/255；
    //      不带 bevel 降到 8.39/255。参考图那圈暖光其实来自 bloom
    //      （泛光溢出轮廓外），不是 bevel。
    // 预览 canvas 是透明的，同样的 bevel shader 会算出粗白边（用户报
    // 「对不上」）。因此关掉它，让预览与引擎观感一致。
    // shader 与 _bevelSet 保留，若引擎将来改成透明 canvas，把下面改成
    // `return v("bevel",0)>0 || v("bevelThickness",0)>0;` 即可恢复。
    return false;
  },
  _specWantsBloom(g) {
    if (!g) return false;
    const v = (k, d) => (g[k] === undefined ? d : Number(g[k]));
    // 与引擎 Rg.bloom.isDefault 同口径：bloomScale===0 && brightness===1
    // && blur===0 && threshold===0 才算默认。
    // 注意 threshold 很高（如 10）时引擎里恒不触发、等价关闭；但这里仍
    // 按"有非默认参数"挂上，让合成走与引擎相同的路径（结果一致：全黑叠加）。
    return v("bloom", 0) > 0 || v("bloomBlur", 0) > 0
      || v("bloomThreshold", 0) > 0 || v("bloomBrightness", 1) !== 1;
  },

  // 把 bevel / bloom / 调色 / alpha 参数落到 figLayer 上（幂等）
  _applyFigFilters(g) {
    if (!figLayer) return;
    const want = [];
    const v0 = (k, d) => (g && g[k] !== undefined ? Number(g[k]) : d);
    // ---- 容器 alpha（引擎 $$ 映射：alpha -> alphaFilterVal，只乘 .a）----
    // 必须在滤镜链之外单独设，不能塞进 adjustment（那会连 RGB 一起乘，
    // 导致人物发灰/发白，用户报「惨白」的成因之一）。
    const l2dAlpha = Math.max(0, Math.min(1, v0("alpha", 1)));
    figLayer.alpha = l2dAlpha;
    // ---- 调色（RGB 乘法染色 + gamma/亮度/对比/饱和）----
    if (this._specWantsAdjust(g)) {
      const f = this._ensureAdjustFilter();
      if (f) { this._adjustSet(f, g); want.push(f); }
    }
    // ---- bevel ----
    if (this._specWantsBevel(g)) {
      const f = this._ensureBevelFilter();
      if (f) { this._bevelSet(f, g); want.push(f); }
    }
    // ---- bloom（**只挂合成 filter 一个**）----
    // 阈值提取与模糊都在 combine.apply() 内部渲染到临时纹理，
    // 绝不能把三个 filter 一起塞进 filters 数组（会导致模糊图变主输出）。
    if (this._specWantsBloom(g)) {
      const fs = this._ensureBloomFilters();
      if (fs && fs.bloom) {
        const v = (k, d) => (g[k] === undefined ? d : Number(g[k]));
        // 阈值：引擎 gD 映射 bloomThreshold -> bloom.threshold 直传（不除 100）。
        // 实测核对（2026-11-20）：effect_table 的**真实 code** 里只用 0.1/0.2
        // （`10` 只出现在 fig_meta 元数据里、不在 code 里，属数据瑕疵）。
        // 之前的 `/100` 会把 0.1 压成 0.001、泛光巨亮 —— 这是与引擎对不上的主因。
        // 仍 clamp 到 [0,1]：引擎 shader 里 `brightness > threshold` 的 brightness
        // 是 0~1 域，超出范围的值只会让阈值失效，钳一下更稳。
        fs.bloomExtract.uniforms.threshold =
          Math.max(0, Math.min(1, v("bloomThreshold", 0)));
        // 模糊：引擎 bloomBlur -> bloom.blur 直传。
        // 核模糊用 _setKernels 重建 kernels；若换回 PIXI 内置 BlurFilter
        // 则直接赋 blur（两种实现都兼容，避免耦合导致整链崩掉）
        const blurVal = v("bloomBlur", 0);
        if (typeof fs.blurPass._setKernels === "function") {
          fs.blurPass._setKernels(blurVal);
        } else {
          fs.blurPass.blur = blurVal;
        }
        fs.bloom.uniforms.bloomScale = v("bloom", 0);
        fs.bloom.uniforms.brightness = v("bloomBrightness", 1);
        want.push(fs.bloom);
      }
    }
    // 签名幂等（PIXI 每次赋 filters 都会重编译 shader）
    const sig = want.map(x => {
      const u = {};
      if (x.uniforms) {
        Object.keys(x.uniforms).forEach(k => {
          const v = x.uniforms[k];
          if (v && typeof v === "object" && v.length) u[k] = Array.from(v);
          else if (v === null || typeof v !== "object") u[k] = v;
        });
      }
      if (x._blur !== undefined) u.__blur = x._blur;   // 核模糊强度（自定义字段）
      if (x._kernels) u.__kernels = Array.from(x._kernels);
      return u;
    });
    const sigStr = JSON.stringify(sig) + "|a:" + l2dAlpha.toFixed(4);
    if (sigStr === state.figFilterSig) return;
    state.figFilterSig = sigStr;
    figLayer.filters = want.length ? want : null;
  },

  async setCamera(cam) {
    // 引擎那些特效是「容器级」的 scale / position / rotation / blur 关键帧
    // （推近、拉远、摇摄、震动…），这里把算好的当前帧参数用 CSS transform
    // 作用在**整个舞台**上（背景层 + 立绘 canvas 一起动，与引擎语义一致）。
    //
    // 注意：只做视觉近似——引擎是真·关键帧插值 + 各种 filter 链，
    // 精确效果以 WebGAL 导出/视频导出为准。但没有它，149 个镜头特效在
    // 预览里完全看不到（用户报「显示不了特效」的主因）。
    const box = document.getElementById("stagebox");
    if (!box) return;
    const c = cam || {};
    if (!c.active) {
      box.style.transform = "";
      box.style.transformOrigin = "50% 50%";
      state.camera = "";
      return;
    }
    const sx = c.scaleX === undefined ? 1 : Number(c.scaleX);
    const sy = c.scaleY === undefined ? sx : Number(c.scaleY);
    // x/y 是「相对舞台宽高的百分比偏移」（Python 侧已换算）
    const tx = c.x === undefined ? 0 : Number(c.x);
    const ty = c.y === undefined ? 0 : Number(c.y);
    const rot = c.rot === undefined ? 0 : Number(c.rot);
    const parts = [];
    if (Math.abs(tx) > 0.001 || Math.abs(ty) > 0.001) {
      parts.push("translate(" + tx + "%, " + ty + "%)");
    }
    if (Math.abs(sx - 1) > 0.001 || Math.abs(sy - 1) > 0.001) {
      parts.push("scale(" + sx + ", " + sy + ")");
    }
    if (Math.abs(rot) > 0.001) parts.push("rotate(" + rot + "deg)");
    box.style.transformOrigin = "50% 50%";
    box.style.transform = parts.join(" ");
    // 动画里的 blur / alpha 也一并反映（震动/闪白类特效会用到）
    if (c.blur !== undefined && Number(c.blur) > 0) {
      box.style.filter = "blur(" + Math.min(30, Number(c.blur)) + "px)";
    } else if (box.style.filter && box.style.filter.indexOf("blur(") === 0) {
      box.style.filter = "";
    }
    if (c.alpha !== undefined) {
      box.style.opacity = String(Math.max(0, Math.min(1, Number(c.alpha))));
    }
    state.camera = parts.join(" ");
  },
};

window.__muppetOnCmd = function (j) {
  let e;
  try { e = JSON.parse(j); } catch (err) { return; }
  const a = e.args || {};
  switch (e.cmd) {
    case "loadModel": enqueue(a.modelId, () => puppetAPI.loadModel(a.modelRef, a.modelId, a.poseParams)); break;
    case "setTransform": enqueue(a.modelId, () => puppetAPI.setTransform(a.modelId, a.x, a.y, a.scale, a.rot)); break;
    case "playMotion": enqueue(a.modelId, () => puppetAPI.playMotion(a.modelId, a.name, a.fadeMs, a.keepPhase)); break;
    case "setExpression": enqueue(a.modelId, () => puppetAPI.setExpression(a.modelId, a.name, a.fadeMs, a.keepPhase)); break;
    case "clearModel": enqueue(a.modelId || "__all__", () => puppetAPI.clear(a.modelId || "")); break;
    case "setPaused": puppetAPI.setPaused(a.paused); break;
    // v3.5.2：背景 / 字幕 / 滤镜（补齐「实时预览没有背景和文字和滤镜」）
    case "setBackground": enqueue("__bg__", () => puppetAPI.setBackground(a.url || "")); break;
    case "setSubtitle": puppetAPI.setSubtitle(a.who || "", a.text || ""); break;
    case "setFilter": puppetAPI.setFilter(a); break;
    // v3.6.4：口型匹配（开口度表由 Python 侧离线算好）
    case "setLip": puppetAPI.setLip(a.modelId, a.vals, a.fps, a.gain, a.start,
                                    a.tag); break;
    // v3.6.2：镜头动画（setTempAnimation）—— 用 CSS transform 模拟
    case "setCamera": puppetAPI.setCamera(a); break;
    // v3.6.5：每帧把工程播放头时间同步进来并**立刻落一次口型**。
    // 口型按工程时间取，不能用墙上时钟（那会和按片段内时间烘好的表错位，
    // 表现为「做动作时嘴闭上、不对口型」）。
    case "setTime":
      lipProjT = Number(a.t) || 0;
      _lipApplyAll();
      break;
    // 手动时钟（导出动画泵）：这两条**同步**执行并回传结果，
    // 泵一次往返就要拿到「实际走了几步」，不能靠事后读快照。
    case "setManualClock": return clockAPI.setManual(a.on);
    case "seek": return clockAPI.seek(a.modelId, a.k, a.dt, a.max, a.allowRestart);
    case "resetPhase": return clockAPI.resetPhase(a.modelId);
    default: sendEvt("error", { code: "cmdUnsupported", cmd: e.cmd, ref: e.id });
  }
};

// 测试/上层观测面（截图与断言都走这里，不依赖内部私有结构）
// v3.6.4：口型排障探针。coreModel 的 API 在 Cubism 2 / 3 上完全不同
// （Cubism2 用 setParamFloat + PARAM_MOUTH_OPEN_Y，Cubism3 用
// setParameterValueById + ParamMouthOpenY），写死任何一个都会在另一种模型
// 上静默失效 —— 实测踩过：探针返回空列表，被误判成「模型没有嘴部参数」。
// 这个函数把真实的方法名和参数名都吐出来，排障时先看它。
window.__muppetProbeModel = function (modelId) {
  const out = { err: "", l2dType: "", methods: [], hasById: false,
                hasFloat: false, count: -1, names: [], mouth: [],
                mouthWritten: null };
  let s = null;
  if (modelId) s = slots.get(modelId);
  if (!s) slots.forEach(v => { if (!s && v.model) s = v; });
  if (!s || !s.model) { out.err = "no_model"; return out; }
  const cm = s.model.internalModel && s.model.internalModel.coreModel;
  if (!cm) { out.err = "no_coreModel"; return out; }
  out.l2dType = (cm.constructor && cm.constructor.name) || "unknown";
  out.hasById = typeof cm.setParameterValueById === "function";
  out.hasFloat = typeof cm.setParamFloat === "function";
  // 方法名（原型链 4 层内）
  const seen = {};
  let p = cm, depth = 0;
  while (p && depth < 4) {
    let ks = [];
    try { ks = Object.getOwnPropertyNames(p); } catch (e) {}
    for (const k of ks) {
      if (seen[k]) continue;
      seen[k] = 1;
      try { if (typeof cm[k] === "function") out.methods.push(k); } catch (e) {}
    }
    p = Object.getPrototypeOf(p);
    depth++;
  }
  out.methods.sort();
  // 参数枚举（两套 API 都试）
  const push = (id, val) => {
    out.names.push(id);
    if (String(id).toLowerCase().indexOf("mouth") >= 0) out.mouth.push([id, val]);
  };
  try {
    if (typeof cm.getParameterCount === "function" &&
        typeof cm.getParameterId === "function") {
      const n = cm.getParameterCount();
      out.count = n;
      for (let i = 0; i < n; i++) {
        let id = "";
        try { id = String(cm.getParameterId(i) || ""); } catch (e) {}
        if (!id) continue;
        let val = null;
        try { val = cm.getParameterValueById(id); } catch (e) {}
        push(id, val);
      }
    } else if (cm._parameterIds) {
      // Cubism 2 内部形态
      out.count = cm._parameterIds.length;
      for (let i = 0; i < cm._parameterIds.length; i++) {
        const id = String(cm._parameterIds[i] || "");
        if (!id) continue;
        push(id, cm._parameterValues ? cm._parameterValues[i] : null);
      }
    }
  } catch (e) { out.err = "enum:" + ((e && e.message) || e); }
  out.names = out.names.slice(0, 80);
  // 嘴部参数到底存不存在：Cubism2 走 getParamIndex 问，Cubism3 靠枚举
  const has = [];
  try {
    if (typeof cm.getParamIndex === "function") {
      for (const nm of ["PARAM_MOUTH_OPEN_Y", "ParamMouthOpenY",
                        "PARAM_MOUTH_FORM", "ParamMouthForm"]) {
        let idx = -1;
        try { idx = cm.getParamIndex(nm); } catch (e) {}
        if (typeof idx === "number" && idx >= 0) has.push([nm, idx]);
      }
    }
  } catch (e) {}
  out.paramIndex = has;
  // 实际写一次 1.0，再读回来看有没有生效 —— 最硬的证据
  const w = _writeMouth(s.model, 1.0);
  out.mouthWritten = w;
  try {
    out.readBack = {};
    for (const nm of ["PARAM_MOUTH_OPEN_Y", "ParamMouthOpenY"]) {
      if (typeof cm.getParamFloat === "function") {
        try { out.readBack[nm] = cm.getParamFloat(nm); } catch (e) {}
      }
      if (typeof cm.getParameterValueById === "function") {
        try { out.readBack[nm] = cm.getParameterValueById(nm); } catch (e) {}
      }
    }
  } catch (e) {}
  return out;
};

// v3.6.4：手工设一个开口度并**推进一帧 + 重画**（验证/排障/导出兜底用）。
// 为什么必须做成页面内函数：宿主页是 `<script type="module">`，
// 里面的 slots / _writeMouth 都是**模块私有**，外部 runJavaScript
// 跑在全局作用域，直接写 `slots` 会报 "slots is not defined"（实测踩过，
// 于是探针全部返回空、被误判成"参数写不进去"）。凡是要碰内部状态的
// 排障入口都必须像这样挂到 window 上。
//
// 为什么写完要 update：SDK 的 `_render` 只在 deltaTime 非零时才结算参数，
// 光写 coreModel 再 app.render() 不会让 draw 采纳新值（实测 maxdiff=0）。
// 这里只推 1ms 并立刻 render；相位会被推 1ms，但**导出主路径不走这里**
// （走 seek，那里按 k 精确定相），本函数只用于排障和「静止帧改嘴」。
window.__muppetSetMouth = function (v, modelId, advance) {
  let s = null;
  if (modelId) s = slots.get(modelId);
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) return { err: "no_model" };
  const m = s.model;
  const w = _writeMouth(m, v);
  try {
    if (advance !== false) {
      // **顺序是试出来的，别改**：
      //   1) update(1) -> deltaTime 置为非零，让稍后的 render 真正结算参数
      //   2) render()   -> 消费 deltaTime 并 internalModel.update（嘴被动作
      //                    覆盖回默认值，这是正常的，下一步补）
      //   3) 还原相位   -> elapsedTime 回到原处，保证可复现
      //   4) 再写一次嘴 -> 此时 deltaTime 已归 0，后续 render 不会再重算，
      //                    写进去的值才能留到 draw 上
      //   5) render()   -> 出帧
      const keepE = m.elapsedTime;
      const keepD = m.deltaTime;
      m.update(1);
      if (app) app.render();
      try { m.elapsedTime = keepE; m.deltaTime = keepD; } catch (e) {}
      _writeMouth(m, v);
    }
    if (app) app.render();
  } catch (e) {}
  return w;
};

// v3.6.6：**确定性推帧探针**（测试专用）。
// 离屏/无窗口环境下 rAF 不一定跑，靠 ticker 验证等于没验证 —— 直接按 dt
// 推帧：每帧 model.update(dt) 累加 deltaTime，再 app.render() 触发
// _render -> internalModel.update -> emit("beforeModelUpdate") -> draw。
// 这条路和真实预览走的是**同一个** internalModel.update，所以能真实反映
// 「嘴有没有被烘进这一帧」。reset=true 时先把 elapsedTime/deltaTime 归零，
// 让两次运行从同一相位起跑，画面才可逐像素对比。
window.__muppetPump = function (n, dt, modelId, reset) {
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) return { err: "no_model" };
  const m = s.model;
  if (reset) {
    try { m.elapsedTime = 0; m.deltaTime = 0; } catch (e) {}
  }
  const N = Math.max(0, Math.round(Number(n) || 0));
  const D = Number(dt) || (1000 / 30);
  const runsBefore = lipHookRuns;
  for (let i = 0; i < N; i++) {
    try { m.update(D); } catch (e) {}
    try { if (app) app.render(); } catch (e) {}
  }
  return { frames: N, hookRunsDelta: lipHookRuns - runsBefore,
           hookRuns: lipHookRuns, stat: lipHookStat };
};

// v3.6.6：**像素级验证**（测试专用）—— 直接回答「嘴到底画出来了没有」。
//
// 为什么必须看像素：参数读回来是**不可信**的。
//   · 帧后读 coreModel.getParamFloat → 被 loadParam() 还原成动作值（读到 0）
//   · 钩子里读 → 一定是我们刚写的值（读到 1）
// 两个都只是"参数数组"的状态，跟**这一帧画了什么**没有必然关系。
// 上一版就是拿参数读回 1.00 交差的，而用户看到的嘴是闭的。
//
// 做法：同一模型、同一相位，只改口型值各渲染一遍，逐像素比。
//   · 差异像素集中在嘴部区域、且数量可观 -> 口型真的进画面了
//   · 两张图完全一样 -> 口型根本没上屏（不管参数读回什么）
// resetPump 保证两边从完全相同的相位起跑，否则运动/呼吸会让全图都在动。
window.__muppetLipPixelTest = function (modelId, n, dt, lipOpen, lipShut) {
  // **结果必须放进全局**：Qt 的 runJavaScript 不会 await Promise，
  // 直接 return Promise 拿到的是 {} —— 会让验证脚本以为"没结果"。
  // 调用方轮询 window.__muppetLipPixelResult.done。
  window.__muppetLipPixelResult = { done: false };
  let s = modelId ? slots.get(modelId) : null;
  if (!s) slots.forEach(q => { if (!s && q.model) s = q; });
  if (!s || !s.model) { window.__muppetLipPixelResult = { done: true, err: "no_model" }; return "no_model"; }
  if (!app || !app.view) { window.__muppetLipPixelResult = { done: true, err: "no_app" }; return "no_app"; }
  const m = s.model;
  const id = modelId || Array.from(slots.keys())[0];
  const box = window.__muppetBox(id, 0) || [0, 0, STAGE_W, STAGE_H];
  const N = Math.max(1, Math.round(Number(n) || 10));
  const D = Number(dt) || (1000 / 30);
  const openV = (lipOpen === undefined || lipOpen === null) ? 1.0 : Number(lipOpen);
  const shutV = (lipShut === undefined || lipShut === null) ? 0.0 : Number(lipShut);
  const keepTable = lipTable.get(id);

  const shotAt = (v) => {
    lipTable.set(id, { vals: new Array(600).fill(v), fps: 30, gain: 1, start: 0 });
    lipProjT = 0;
    try { m.elapsedTime = 0; m.deltaTime = 0; } catch (e) {}
    for (let i = 0; i < N; i++) {
      try { m.update(D); } catch (e) {}
      try { app.render(); } catch (e) {}
    }
    const url = window.__muppetGrab(box);
    return { url: url, stat: lipHookStat };
  };

  const A = shotAt(openV);
  const B = shotAt(shutV);
  // 还原原表（测试不该改变运行状态）
  if (keepTable) lipTable.set(id, keepTable); else lipTable.delete(id);

  // ---- 逐像素比对（在页面内做，避免传两张 1280x720 的 PNG 出去）----
  const W = box[2], H = box[3];
  const cvA = document.createElement("canvas"); cvA.width = W; cvA.height = H;
  const cvB = document.createElement("canvas"); cvB.width = W; cvB.height = H;
  const cxA = cvA.getContext("2d"), cxB = cvB.getContext("2d");
  let loaded = 0;
  const done = () => { loaded++; };
  const _finishAll = (obj) => {
    window.__muppetLipPixelResult = Object.assign({ done: true }, obj || {});
  };
  new Promise((resolve) => {
    const finish = () => {
      let dA, dB;
      try { dA = cxA.getImageData(0, 0, W, H).data; } catch (e) { resolve({ err: "getImageData:" + e }); return; }
      try { dB = cxB.getImageData(0, 0, W, H).data; } catch (e) { resolve({ err: "getImageData:" + e }); return; }
